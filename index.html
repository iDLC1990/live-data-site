<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Друк етикеток</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --text-muted: #6c757d;
      --border-color: #e0e0e0;
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --brand-color: #28a745;
      --brand-hover: #218838;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .manual-input-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .manual-input-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .manual-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      align-items: end;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .form-input {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    textarea.form-input {
      resize: vertical;
      min-height: 70px;
      font-size: 13px;
      line-height: 1.4;
    }

    .code-text {
      font-family: monospace;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-secondary {
      background-color: #6c757d;
      color: #fff;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }

    .btn-brand {
      background-color: var(--brand-color);
      color: #fff;
    }
    .btn-brand:hover {
      background-color: var(--brand-hover);
    }

    /* Стилі для друку */
    @media print {
      body * {
        visibility: hidden;
      }
      #printContainer, #printContainer * {
        visibility: visible;
      }
      #printContainer {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      @page {
        size: 100mm 78mm;
        margin: 0;
      }
    }

    .industrial-label {
      width: 100mm;
      height: 78mm;
      box-sizing: border-box;
      padding: 4mm;
      background: #fff;
      page-break-after: always;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #ccc; /* Для попереднього перегляду на екрані */
      margin-bottom: 10px;
    }

    @media print {
      .industrial-label {
        border: none;
        margin-bottom: 0;
      }
    }

    .top-divider {
      height: 2px;
      background: #000;
      margin-bottom: 2mm;
    }

    .label-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2mm;
    }

    .section-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 12pt;
      font-weight: bold;
    }

    .barcode-box {
      width: 100%;
      display: flex;
      justify-content: center;
      margin: 1mm 0;
    }

    .barcode-box svg {
      max-width: 100%;
      height: auto;
    }

    .val-pn, .val-sn {
      font-family: monospace;
      font-size: 11pt;
      font-weight: bold;
      text-align: center;
    }

    .brand-tag {
      background: #000;
      color: #fff;
      padding: 1px 6px;
      font-size: 10pt;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="standardLabelsSection">
      <div class="manual-input-card">
        <div class="manual-input-title">✍️ Ручне / Масове введення та друк (вставка з Google Таблиць)</div>
        <div class="manual-form-grid">
          <div class="form-group">
            <label for="manualSn">Serial Number (SN)</label>
            <textarea id="manualSn" class="form-input code-text" rows="3" placeholder="SN12345678&#10;SN87654321"></textarea>
          </div>
          <div class="form-group">
            <label for="manualPn">Part Number (PN)</label>
            <textarea id="manualPn" class="form-input code-text" rows="3" placeholder="PN98765432&#10;PN12345678"></textarea>
          </div>
          <div class="form-group">
            <label for="manualBrand">Brand</label>
            <textarea id="manualBrand" class="form-input" rows="3" placeholder="TPV"></textarea>
          </div>
          <div class="form-group" style="justify-content: flex-end;">
            <label>&nbsp;</label>
            <button class="btn btn-secondary" onclick="printManual(false)">🖨️ Друк</button>
          </div>
          <div class="form-group" style="justify-content: flex-end;">
            <label>&nbsp;</label>
            <button class="btn btn-brand" onclick="printManual(true)">🖨️ З Brand</button>
          </div>
        </div>
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">
          💡 <strong>Порада:</strong> Ви можете скопіювати з Google Таблиці декілька колонок (SN, PN, Brand) або стовпчик SN та вставити в поле SN — дані автоматично розділяться по рядках та полям.
        </div>
      </div>
    </div>
  </div>

  <div id="printContainer"></div>

  <script>
    const selectedSerials = new Set();
    let products = [];
    let currentGid = '0';
    const printContainer = document.getElementById('printContainer');

    // Пошук в локальній базі даних (за наявності)
    async function getProductFromDatabase(sn) {
      if (!products || products.length === 0) return null;
      const found = products.find(p => p.sn === sn);
      return found || null;
    }

    function updateBatchBar() {
      const count = selectedSerials.size;
      const countElem = document.getElementById('selectedCountText');
      if (countElem) countElem.innerText = `Вибрано позицій: ${count}`;
      
      const btnNorm = document.getElementById('batchPrintNormalBtn');
      const btnBrand = document.getElementById('batchPrintBrandBtn');
      if (btnNorm && btnBrand) {
        if (count > 0) {
          btnNorm.removeAttribute('disabled'); 
          btnBrand.removeAttribute('disabled');
        } else {
          btnNorm.setAttribute('disabled', 'true'); 
          btnBrand.setAttribute('disabled', 'true');
        }
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function prepareAndPrint() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setTimeout(() => window.print(), 120);
        });
      });
    }

    function printBigText() {
      const input = document.getElementById('bigTextInput');
      if (!input) return;
      const text = input.value.trim().toUpperCase();
      if (!text) { alert('Введіть текст!'); return; }

      const svgNS = "http://www.w3.org/2000/svg";
      const tempSvg = document.createElementNS(svgNS, "svg");
      const tempText = document.createElementNS(svgNS, "text");
      tempText.setAttribute("font-family", "Arial, Helvetica, sans-serif");
      tempText.setAttribute("font-weight", "900");
      tempText.setAttribute("font-size", "100");
      tempText.textContent = text;
      tempSvg.appendChild(tempText);
      
      tempSvg.style.position = 'absolute';
      tempSvg.style.visibility = 'hidden';
      document.body.appendChild(tempSvg);
      
      const bbox = tempText.getBBox();
      document.body.removeChild(tempSvg);

      const paddingX = bbox.width * 0.02;
      const paddingY = bbox.height * 0.05;
      
      const vbX = bbox.x - paddingX;
      const vbY = bbox.y - paddingY;
      const vbW = bbox.width + (paddingX * 2);
      const vbH = bbox.height + (paddingY * 2);

      printContainer.innerHTML = `
        <div class="industrial-label" style="padding: 0 !important; display: block !important; background: #ffffff !important; border: none !important; width: 100mm; height: 78mm; overflow: hidden;">
          <svg width="100%" height="100%" viewBox="${vbX} ${vbY} ${vbW} ${vbH}" preserveAspectRatio="none" style="display: block; width: 100mm; height: 78mm;">
            <text x="${bbox.x + bbox.width/2}" y="${bbox.y + bbox.height/2}" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="100">${escapeHtml(text)}</text>
          </svg>
        </div>
      `;
      prepareAndPrint();
    }

    function printRepeatText() {
      const input = document.getElementById('repeatTextInput');
      if (!input) return;
      const text = input.value.trim().toUpperCase();
      if (!text) { alert('Введіть текст!'); return; }

      let divs = '';
      for (let i = 0; i < 8; i++) {
        divs += `<div style="font-family: Arial, Helvetica, sans-serif; font-weight: normal; font-size: 20pt; text-align: center; text-transform: uppercase; color: #000000; line-height: 1;">${escapeHtml(text)}</div>`;
      }

      printContainer.innerHTML = `
        <div class="industrial-label" style="padding: 2mm 2mm !important; display: flex !important; flex-direction: column !important; justify-content: space-between !important; align-items: stretch !important; background: #ffffff !important; border: none !important; height: 78mm !important;">
          ${divs}
        </div>
      `;
      prepareAndPrint();
    }

    function printTestLabel() {
      printContainer.innerHTML = `
        <div class="industrial-label">
          <div class="top-divider"></div>
          <div class="label-section">
            <div class="section-header"><span class="header-title">PN:</span></div>
            <div class="barcode-box"><svg id="testPN"></svg></div>
            <div class="val-pn">TEST-PN-100X78</div>
          </div>
          <div class="label-section">
            <div class="section-header"><span class="header-title">SN:</span></div>
            <div class="barcode-box"><svg id="testSN"></svg></div>
            <div class="val-sn">TEST-SN-27082026</div>
          </div>
        </div>
      `;
      JsBarcode('#testPN', 'TEST-PN-100X78', { format: 'CODE128B', displayValue: false, margin: 0, height: 48, width: 1.18, flat: true, lineColor: '#000' });
      JsBarcode('#testSN', 'TEST-SN-27082026', { format: 'CODE128B', displayValue: false, margin: 0, height: 48, width: 0.92, flat: true, lineColor: '#000' });
      prepareAndPrint();
    }

    async function printManual(includeBrand) {
      const snRaw = document.getElementById('manualSn').value.trim();
      const pnRaw = document.getElementById('manualPn').value.trim();
      const brandRaw = document.getElementById('manualBrand').value.trim();

      if (!snRaw && !pnRaw) {
        alert('Будь ласка, заповніть хоча б Serial Number або Part Number!');
        return;
      }

      // Розбиваємо ввід на окремі рядки
      const snLines = snRaw ? snRaw.split(/\r?\n/).map(s => s.trim()) : [];
      const pnLines = pnRaw ? pnRaw.split(/\r?\n/).map(s => s.trim()) : [];
      const brandLines = brandRaw ? brandRaw.split(/\r?\n/).map(s => s.trim()) : [];

      const maxLines = Math.max(snLines.length, pnLines.length, brandLines.length);
      const itemsList = [];

      for (let i = 0; i < maxLines; i++) {
        let sn = snLines[i] || '';
        let pn = pnLines[i] || '';
        let brand = brandLines[i] || (brandLines[0] || '-'); // якщо бренд один, застосовуємо його до всіх

        // Якщо рядок містить табуляцію (пряма вставка кількох колонок із Google Таблиць)
        if (sn.includes('\t')) {
          const parts = sn.split('\t').map(p => p.trim());
          sn = parts[0] || '';
          if (parts[1]) pn = parts[1];
          if (parts[2]) brand = parts[2];
        }

        // Якщо ввели тільки SN, але немає PN — пробуємо знайти в базі даних
        if (sn && (!pn || pn === '')) {
          const dbData = await getProductFromDatabase(sn);
          if (dbData && dbData.pn) {
            pn = dbData.pn;
          }
          if ((!brand || brand === '-') && dbData && dbData.brand) {
            brand = dbData.brand;
          }
        }

        if (sn || pn) {
          itemsList.push({
            sn: sn || 'N/A',
            pn: pn || 'N/A',
            brand: brand || '-'
          });
        }
      }

      if (itemsList.length === 0) {
        alert('Не знайдено даних для друку!');
        return;
      }

      printContainer.innerHTML = buildLabelsHTML(itemsList, includeBrand);
      renderBarcodesInContainer('#printContainer');
      prepareAndPrint();
    }

    function buildLabelsHTML(itemsList, includeBrand) {
      let html = '';
      itemsList.forEach((product, idx) => {
        for (let copy = 0; copy < 2; copy++) {
          html += `
            <div class="industrial-label">
              <div class="top-divider"></div>
              <div class="label-section">
                <div class="section-header ${includeBrand ? 'has-brand' : ''}">
                  <span class="header-title">PN:</span>
                  ${includeBrand ? `<span class="brand-tag">${escapeHtml(product.brand)}</span>` : ''}
                </div>
                <div class="barcode-box"><svg id="barcodePN_${idx}_${copy}"></svg></div>
                <div class="val-pn">${escapeHtml(product.pn)}</div>
              </div>
              <div class="label-section">
                <div class="section-header"><span class="header-title">SN:</span></div>
                <div class="barcode-box"><svg id="barcodeSN_${idx}_${copy}"></svg></div>
                <div class="val-sn">${escapeHtml(product.sn)}</div>
              </div>
            </div>
          `;
        }
      });
      return html;
    }

    function renderBarcodesInContainer(containerSelector) {
      const container = document.querySelector(containerSelector);
      if (!container) return;
      container.querySelectorAll('.industrial-label').forEach((label) => {
        const svgPn = label.querySelector('[id^="barcodePN_"]');
        const svgSn = label.querySelector('[id^="barcodeSN_"]');
        if (svgPn && svgSn) {
          const pnVal = label.querySelector('.val-pn').innerText;
          const snVal = label.querySelector('.val-sn').innerText;
          JsBarcode(svgPn, pnVal, { format: "CODE128B", displayValue: false, margin: 0, height: 48, width: 1.18, flat: true, lineColor: "#000000" });
          JsBarcode(svgSn, snVal, { format: "CODE128B", displayValue: false, margin: 0, height: 48, width: 0.92, flat: true, lineColor: "#000000" });
        }
      });
    }

    function printSingle(index, includeBrand) {
      const product = products[index];
      if (!product) return;
      printContainer.innerHTML = buildLabelsHTML([product], includeBrand);
      renderBarcodesInContainer('#printContainer');
      prepareAndPrint();
    }

    function printBatch(includeBrand) {
      if (selectedSerials.size === 0) return;
      const itemsToPrint = products.filter(p => selectedSerials.has(p.sn));
      if (itemsToPrint.length === 0) return;
      printContainer.innerHTML = buildLabelsHTML(itemsToPrint, includeBrand);
      renderBarcodesInContainer('#printContainer');
      prepareAndPrint();
      selectedSerials.clear();
      renderTable();
      updateBatchBar();
    }

    function renderTable() {}

    function fetchDataFromGoogleSheet(isInitial) {}

    function switchSheet(gid) {
      currentGid = gid;
      fetchDataFromGoogleSheet(true);
    }

    // Обробник гарячих клавіш
    document.addEventListener('keydown', (e) => {
      if (e.altKey) {
        if (e.key === '1') { e.preventDefault(); switchSheet('0'); } 
        else if (e.key === '2') { e.preventDefault(); switchSheet('193025884'); }
        else if (e.key === '3') { e.preventDefault(); switchSheet('custom'); }
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
        e.preventDefault(); 
        if (products.length > 0 && currentGid !== 'custom') {
          if (selectedSerials.size > 0) printBatch(false);
          else printSingle(0, false);
        }
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet(true);
      setInterval(() => fetchDataFromGoogleSheet(false), 2000);

      // Автоматичний розбір вставки кількох колонок/рядків із Google Таблиць
      const manualSnElem = document.getElementById('manualSn');
      if (manualSnElem) {
        manualSnElem.addEventListener('paste', (e) => {
          const clipboardData = e.clipboardData || window.clipboardData;
          const pastedText = clipboardData ? clipboardData.getData('Text') : '';

          if (pastedText && pastedText.includes('\t')) {
            e.preventDefault();
            const lines = pastedText.split(/\r?\n/).filter(line => line.trim() !== '');
            const sns = [];
            const pns = [];
            const brands = [];

            lines.forEach(line => {
              const parts = line.split('\t').map(p => p.trim());
              if (parts[0]) sns.push(parts[0]);
              if (parts[1]) pns.push(parts[1]);
              if (parts[2]) brands.push(parts[2]);
            });

            manualSnElem.value = sns.join('\n');
            if (pns.length > 0) document.getElementById('manualPn').value = pns.join('\n');
            if (brands.length > 0) document.getElementById('manualBrand').value = brands.join('\n');
          }
        });
      }
    });
  </script>
</body>
</html>
