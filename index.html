<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Печать этикеток — TSC DA220 с визуальным редактором</title>
  
  <!-- Библиотеки -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
        СТИЛИ ИНТЕРФЕЙСА (ТЕМНАЯ ТЕМА)
        ========================================== */
    :root {
      --bg-color: #111827;
      --card-bg: #1F2937;
      --accent-color: #2563EB;
      --accent-hover: #1D4ED8;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --border-color: #374151;
      --radius: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .app-container { max-width: 1020px; width: 100%; }
    
    .page-header { 
      margin-bottom: 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .page-title { font-size: 26px; font-weight: 700; color: #FFFFFF; }
    .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: #065F46;
      color: #34D399;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 6px;
      font-weight: 500;
    }

    .top-editors-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background-color: #111827;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 24px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 16px 24px;
      font-size: 14px;
      color: #E5E7EB;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }

    .code-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Кнопки */
    .actions-cell { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background-color: #374151; color: #F3F4F6; }
    .btn-secondary:hover { background-color: #4B5563; }
    .btn-success { background-color: #059669; }
    .btn-success:hover { background-color: #047857; }

    /* ==========================================
        МОДАЛЬНОЕ ОКНО ВИЗУАЛЬНОГО РЕДАКТОРА
        ========================================== */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease-in-out;
      z-index: 1000;
      padding: 20px;
    }

    .modal-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .editor-modal-card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-modal);
      width: 100%; max-width: 980px;
      max-height: 92vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #111827; }
    .modal-title { font-size: 18px; font-weight: 600; color: #FFFFFF; }
    .modal-close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
    
    .editor-modal-body {
      padding: 24px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 24px;
      overflow-y: auto;
      background-color: #111827;
      align-items: start;
    }
    @media (max-width: 900px) { .editor-modal-body { grid-template-columns: 1fr; } }

    .controls-pane { background: #1F2937; padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); }
    .controls-pane h3 { font-size: 14px; margin-bottom: 12px; color: #60A5FA; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .control-group { margin-bottom: 12px; font-size: 12px; }
    .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); margin-bottom: 4px; }
    .control-group input[type="range"] { width: 100%; accent-color: var(--accent-color); cursor: pointer; }

    .preview-pane {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #182234;
      padding: 20px;
      border-radius: 8px;
      border: 1px dashed var(--border-color);
    }
    .preview-pane span.hint { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Блок для копирования параметров (то что скинешь мне) */
    .export-box {
      margin-top: 16px;
      background: #111827;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }
    .export-box label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .export-box textarea {
      width: 100%;
      height: 70px;
      background: #1F2937;
      border: 1px solid var(--border-color);
      color: #34D399;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 4px;
      resize: none;
    }

    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #111827; }

    /* ==========================================
        ЭТИКЕТКА 100x80 мм (Живой макет)
        ========================================== */
    .industrial-label {
      width: 100mm;
      height: 80mm;
      padding: 3mm;
      background-color: #FFFFFF;
      color: #000000;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      border: 1px solid #D1D5DB;
      position: relative;
      overflow: hidden;
    }

    .label-block { display: flex; flex-direction: column; align-items: center; width: 100%; position: relative; }
    .label-caption { font-weight: 900; color: #000000; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }

    .barcode-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; }
    .barcode-wrapper svg { max-width: 100%; display: block; }

    /* ==========================================
        ПЕЧАТЬ (TSC DA220)
        ========================================== */
    @page { size: 100mm 80mm landscape; margin: 0; }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .app-container, .modal-backdrop { display: none !important; }
      #printContainer, #printContainer * { visibility: visible !important; }
      #printContainer {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        position: absolute !important;
        left: 0 !important; top: 0 !important;
        width: 100mm !important; height: 80mm !important;
        background: #FFFFFF !important;
      }
      #printContainer .industrial-label { border: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <div>
        <h1 class="page-title">🖨️ Друк етикеток (TSC DA220)</h1>
        <p class="page-subtitle">Лист: FI Station KOVALCHYK Y. (Авто-обновление каждые 30 сек)</p>
        <div class="status-badge" id="statusBadge">🟡 Подключение к базам данных...</div>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet()">🔄 Обновить сейчас</button>
      </div>
    </header>

    <!-- Кнопки быстрого доступа к редакторам (CS и MNT) -->
    <div class="top-editors-bar">
      <button class="btn btn-secondary" onclick="openEditor('cs')">⚙️ Редактор CS (Обычные)</button>
      <button class="btn btn-success" onclick="openEditor('mnt')">⚙️ Редактор MNT (С брендом)</button>
    </div>

    <main class="card">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Serial Number (SN)</th>
              <th>Part Number (PN)</th>
              <th>Brand</th>
              <th style="width: 150px; text-align: right;">Печать (CS / MNT)</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="5" style="text-align: center; padding: 30px;">Загрузка данных...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- УНИВЕРСАЛЬНОЕ ОКНО РЕДАКТОРА С ЖИВЫМ ПРЕВЬЮ И ПОЛЕМ ДЛЯ ПЕРЕДАЧИ МНЕ -->
  <div class="modal-backdrop" id="editorModal">
    <div class="editor-modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="editorModalTitle">Редактор этикетки</h2>
        <button class="modal-close-btn" onclick="closeEditor()">&times;</button>
      </div>
      
      <div class="editor-modal-body">
        <!-- Слева: Панель ползунков + блок параметров для отправки мне -->
        <div>
          <div class="controls-pane" id="controlsPaneContainer"></div>
          
          <div class="export-box">
            <label>📋 Скопируй и скинь мне эти параметры после подгонки:</label>
            <textarea id="paramsExportField" readonly onclick="this.select();"></textarea>
          </div>
        </div>

        <!-- Справа: Живой визуальный макет этикетки -->
        <div class="preview-pane">
          <span class="hint">Живой предпросмотр (100x80 мм)</span>
          <div id="livePreviewContainer"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="resetCurrentEditor()">Сбросить</button>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-secondary" onclick="closeEditor()">Закрыть</button>
          <button class="btn" onclick="printFromEditor()">🖨️ Печать</button>
        </div>
      </div>
    </div>
  </div>

  <div id="printContainer" style="display: none;"></div>

  <script>
    // --- НАСТРОЙКИ SUPABASE ---
    const SUPABASE_URL = 'https://xgjggfnfgrmkuclgjmih.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MLyF6CMVplwDyDqSeDnSBA__RakJscC';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = 'products_db';
    const COLUMN_PN = 'tpv_pn';
    const COLUMN_SN = 'panel_sn';
    const COLUMN_BRAND = 'brand';

    const SHEET_ID = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
    const GID = '0';

    let products = [];
    let activeEditorType = 'cs';
    let sampleProduct = { sn: "SN1234567890", pn: "PN-SAMPLE-999", brand: "SAMPLE BRAND" };

    const tableBody = document.getElementById('productsTableBody');
    const editorModal = document.getElementById('editorModal');

    function getParams(type) {
      if (type === 'cs') {
        return {
          v1: parseInt(document.getElementById('cs_v1')?.value || 0),
          h1: parseInt(document.getElementById('cs_h1')?.value || 52),
          f1: parseInt(document.getElementById('cs_f1')?.value || 22),
          v2: parseInt(document.getElementById('cs_v2')?.value || 0),
          h2: parseInt(document.getElementById('cs_h2')?.value || 72),
          f2: parseInt(document.getElementById('cs_f2')?.value || 17),
        };
      } else {
        return {
          bx: parseInt(document.getElementById('mnt_bx')?.value || 0),
          by: parseInt(document.getElementById('mnt_by')?.value || 0),
          bf: parseInt(document.getElementById('mnt_bf')?.value || 16),
          v1: parseInt(document.getElementById('mnt_v1')?.value || 0),
          h1: parseInt(document.getElementById('mnt_h1')?.value || 45),
          f1: parseInt(document.getElementById('mnt_f1')?.value || 20),
          v2: parseInt(document.getElementById('mnt_v2')?.value || 0),
          h2: parseInt(document.getElementById('mnt_h2')?.value || 60),
          f2: parseInt(document.getElementById('mnt_f2')?.value || 15),
        };
      }
    }

    function renderControlsPane(type) {
      const container = document.getElementById('controlsPaneContainer');
      if (type === 'cs') {
        container.innerHTML = `
          <h3>Редактор 1: CS (Обычная)</h3>
          <div class="control-group">
            <label><span>1. Перемещение по вертикали (Верх):</span> <strong id="lbl_cs_v1">0</strong>px</label>
            <input type="range" id="cs_v1" min="-50" max="50" value="0" oninput="onSliderInput('cs')">
          </div>
          <div class="control-group">
            <label><span>2. Высота букв/штрихкода (Верх):</span> <strong id="lbl_cs_h1">52</strong>px</label>
            <input type="range" id="cs_h1" min="20" max="100" value="52" oninput="onSliderInput('cs')">
          </div>
          <div class="control-group">
            <label><span>3. Размер шрифта (Верх):</span> <strong id="lbl_cs_f1">22</strong>pt</label>
            <input type="range" id="cs_f1" min="10" max="40" value="22" oninput="onSliderInput('cs')">
          </div>
          <hr style="border-color: var(--border-color); margin: 12px 0;">
          <div class="control-group">
            <label><span>1. Перемещение по вертикали (Низ):</span> <strong id="lbl_cs_v2">0</strong>px</label>
            <input type="range" id="cs_v2" min="-50" max="50" value="0" oninput="onSliderInput('cs')">
          </div>
          <div class="control-group">
            <label><span>2. Высота букв/штрихкода (Низ):</span> <strong id="lbl_cs_h2">72</strong>px</label>
            <input type="range" id="cs_h2" min="20" max="120" value="72" oninput="onSliderInput('cs')">
          </div>
          <div class="control-group">
            <label><span>3. Размер шрифта (Низ):</span> <strong id="lbl_cs_f2">17</strong>pt</label>
            <input type="range" id="cs_f2" min="10" max="35" value="17" oninput="onSliderInput('cs')">
          </div>
        `;
      } else {
        container.innerHTML = `
          <h3>Редактор 2: MNT (С брендом)</h3>
          <div class="control-group">
            <label><span>4. Brand по горизонтали / вертикали:</span> <strong id="lbl_mnt_bx">0</strong> / <strong id="lbl_mnt_by">0</strong>px</label>
            <div style="display: flex; gap: 6px;">
              <input type="range" id="mnt_bx" min="-150" max="150" value="0" oninput="onSliderInput('mnt')" title="По горизонтали">
              <input type="range" id="mnt_by" min="-50" max="50" value="0" oninput="onSliderInput('mnt')" title="По вертикали">
            </div>
          </div>
          <div class="control-group">
            <label><span>3. Размер шрифта Brand:</span> <strong id="lbl_mnt_bf">16</strong>pt</label>
            <input type="range" id="mnt_bf" min="10" max="35" value="16" oninput="onSliderInput('mnt')">
          </div>
          <hr style="border-color: var(--border-color); margin: 12px 0;">
          <div class="control-group">
            <label><span>1. Перемещение по вертикали (Верх):</span> <strong id="lbl_mnt_v1">0</strong>px</label>
            <input type="range" id="mnt_v1" min="-50" max="50" value="0" oninput="onSliderInput('mnt')">
          </div>
          <div class="control-group">
            <label><span>2. Высота ШК / 3. Шрифт (Верх):</span> <strong id="lbl_mnt_h1">45</strong>px / <strong id="lbl_mnt_f1">20</strong>pt</label>
            <div style="display: flex; gap: 6px;">
              <input type="range" id="mnt_h1" min="20" max="100" value="45" oninput="onSliderInput('mnt')">
              <input type="range" id="mnt_f1" min="10" max="35" value="20" oninput="onSliderInput('mnt')">
            </div>
          </div>
          <div class="control-group">
            <label><span>1. Перемещение по вертикали (Низ):</span> <strong id="lbl_mnt_v2">0</strong>px</label>
            <input type="range" id="mnt_v2" min="-50" max="50" value="0" oninput="onSliderInput('mnt')">
          </div>
          <div class="control-group">
            <label><span>2. Высота ШК / 3. Шрифт (Низ):</span> <strong id="lbl_mnt_h2">60</strong>px / <strong id="lbl_mnt_f2">15</strong>pt</label>
            <div style="display: flex; gap: 6px;">
              <input type="range" id="mnt_h2" min="20" max="100" value="60" oninput="onSliderInput('mnt')">
              <input type="range" id="mnt_f2" min="10" max="30" value="15" oninput="onSliderInput('mnt')">
            </div>
          </div>
        `;
      }
    }

    function generateLabelMarkup(type, product) {
      const p = getParams(type);
      if (type === 'cs') {
        return `
          <div class="industrial-label">
            <div class="label-block" style="transform: translateY(${p.v1}px);">
              <span class="label-caption">PN</span>
              <div class="barcode-wrapper"><svg id="live_bc_pn"></svg></div>
              <span style="font-size: ${p.f1}pt; font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.pn)}</span>
            </div>
            <div style="height: 10px; width: 100%;"></div>
            <div class="label-block" style="transform: translateY(${p.v2}px);">
              <span class="label-caption">SN</span>
              <div class="barcode-wrapper"><svg id="live_bc_sn"></svg></div>
              <span style="font-size: ${p.f2}pt; font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1; transform: scaleY(1.5);">${escapeHtml(product.sn)}</span>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="industrial-label">
            <div style="position: absolute; transform: translate(${p.bx}px, ${p.by}px); font-size: ${p.bf}pt; font-weight: 900; text-transform: uppercase;">
              ${escapeHtml(product.brand)}
            </div>
            <div class="label-block" style="transform: translateY(${p.v1}px); margin-top: 12px;">
              <span class="label-caption">PN</span>
              <div class="barcode-wrapper"><svg id="live_bc_pn"></svg></div>
              <span style="font-size: ${p.f1}pt; font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.pn)}</span>
            </div>
            <div style="height: 5px; width: 100%;"></div>
            <div class="label-block" style="transform: translateY(${p.v2}px);">
              <span class="label-caption">SN</span>
              <div class="barcode-wrapper"><svg id="live_bc_sn"></svg></div>
              <span style="font-size: ${p.f2}pt; font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1; transform: scaleY(1.5);">${escapeHtml(product.sn)}</span>
            </div>
          </div>
        `;
      }
    }

    function updateLivePreview(prod = sampleProduct) {
      const previewPaneContainer = document.getElementById('livePreviewContainer');
      previewPaneContainer.innerHTML = generateLabelMarkup(activeEditorType, prod);
      
      const p = getParams(activeEditorType);
      try {
        JsBarcode("#live_bc_pn", prod.pn, { format: "CODE128", displayValue: false, margin: 0, height: p.h1, width: 2 });
        JsBarcode("#live_bc_sn", prod.sn, { format: "CODE128", displayValue: false, margin: 0, height: p.h2, width: 2 });
      } catch (e) {}

      // Автоматическое обновление текста в поле для отправки мне
      document.getElementById('paramsExportField').value = JSON.stringify({ type: activeEditorType, ...p }, null, 2);
    }

    function onSliderInput(type) {
      const p = getParams(type);
      if (type === 'cs') {
        document.getElementById('lbl_cs_v1').innerText = p.v1;
        document.getElementById('lbl_cs_h1').innerText = p.h1;
        document.getElementById('lbl_cs_f1').innerText = p.f1;
        document.getElementById('lbl_cs_v2').innerText = p.v2;
        document.getElementById('lbl_cs_h2').innerText = p.h2;
        document.getElementById('lbl_cs_f2').innerText = p.f2;
      } else {
        document.getElementById('lbl_mnt_bx').innerText = p.bx;
        document.getElementById('lbl_mnt_by').innerText = p.by;
        document.getElementById('lbl_mnt_bf').innerText = p.bf;
        document.getElementById('lbl_mnt_v1').innerText = p.v1;
        document.getElementById('lbl_mnt_h1').innerText = p.h1;
        document.getElementById('lbl_mnt_f1').innerText = p.f1;
        document.getElementById('lbl_mnt_v2').innerText = p.v2;
        document.getElementById('lbl_mnt_h2').innerText = p.h2;
        document.getElementById('lbl_mnt_f2').innerText = p.f2;
      }
      updateLivePreview(sampleProduct);
    }

    function openEditor(type, productFromTable = null) {
      activeEditorType = type;
      if (productFromTable) {
        sampleProduct = productFromTable;
      }
      document.getElementById('editorModalTitle').innerText = type === 'cs' ? 'Редактор этикетки: CS (Обычная)' : 'Редактор этикетки: MNT (С брендом)';
      renderControlsPane(type);
      updateLivePreview(sampleProduct);
      editorModal.classList.add('is-open');
    }

    function closeEditor() {
      editorModal.classList.remove('is-open');
    }

    function resetCurrentEditor() {
      if (activeEditorType === 'cs') {
        document.getElementById('cs_v1').value = 0; document.getElementById('cs_h1').value = 52; document.getElementById('cs_f1').value = 22;
        document.getElementById('cs_v2').value = 0; document.getElementById('cs_h2').value = 72; document.getElementById('cs_f2').value = 17;
      } else {
        document.getElementById('mnt_bx').value = 0; document.getElementById('mnt_by').value = 0; document.getElementById('mnt_bf').value = 16;
        document.getElementById('mnt_v1').value = 0; document.getElementById('mnt_h1').value = 45; document.getElementById('mnt_f1').value = 20;
        document.getElementById('mnt_v2').value = 0; document.getElementById('mnt_h2').value = 60; document.getElementById('mnt_f2').value = 15;
      }
      onSliderInput(activeEditorType);
    }

    function printFromEditor() {
      const printContainer = document.getElementById('printContainer');
      printContainer.innerHTML = generateLabelMarkup(activeEditorType, sampleProduct);
      
      const p = getParams(activeEditorType);
      try {
        printContainer.querySelector('#live_bc_pn').id = 'print_bc_pn';
        printContainer.querySelector('#live_bc_sn').id = 'print_bc_sn';
        JsBarcode("#print_bc_pn", sampleProduct.pn, { format: "CODE128", displayValue: false, margin: 0, height: p.h1, width: 2 });
        JsBarcode("#print_bc_sn", sampleProduct.sn, { format: "CODE128", displayValue: false, margin: 0, height: p.h2, width: 2 });
      } catch (e) {}

      window.print();
    }

    // --- GOOGLE SHEETS & SUPABASE ---
    function parseCSV(str) {
      const arr = [];
      let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    async function getProductFromDatabase(sn) {
      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select(`${COLUMN_PN}, ${COLUMN_BRAND}`)
          .eq(COLUMN_SN, sn)
          .single();

        if (error || !data) return { pn: "NOT_FOUND_IN_DB", brand: "-" };
        return { pn: data[COLUMN_PN] || "N/A", brand: data[COLUMN_BRAND] || "-" };
      } catch (e) {
        return { pn: "DB_ERROR", brand: "ERR" };
      }
    }

    async function fetchDataFromGoogleSheet() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&_nc=${Date.now()}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Ошибка сети Google Sheets');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const rawSnList = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;
          const sn = row[2] ? row[2].trim() : '';
          if (sn && sn.toUpperCase() !== 'SERIAL NUMBER') rawSnList.push(sn);
        }

        const lastSnList = rawSnList.slice(-5).reverse();
        const validItems = [];

        for (const sn of lastSnList) {
          const dbData = await getProductFromDatabase(sn);
          validItems.push({ pn: dbData.pn, brand: dbData.brand, sn: sn });
        }

        products = validItems;
        if (products.length > 0) {
          sampleProduct = products[0];
        }
        renderTable();

        const badge = document.getElementById('statusBadge');
        badge.style.background = '#065F46';
        badge.style.color = '#34D399';
        badge.innerText = `🟢 Синхронизировано (${new Date().toLocaleTimeString()})`;
      } catch (error) {
        console.error(error);
        const badge = document.getElementById('statusBadge');
        badge.style.background = '#991B1B';
        badge.style.color = '#FCA5A5';
        badge.innerText = '🔴 Ошибка связи';
      }
    }

    function renderTable() {
      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">Записей не найдено</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      products.forEach((product, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${index + 1}</strong></td>
          <td class="code-text">${escapeHtml(product.sn)}</td>
          <td class="code-text">${escapeHtml(product.pn)}</td>
          <td><span style="background: #374151; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${escapeHtml(product.brand)}</span></td>
          <td class="actions-cell">
            <button class="btn btn-secondary" onclick="openEditor('cs', products[${index}])" title="Обычная этикетка (CS)">CS</button>
            <button class="btn btn-success" onclick="openEditor('mnt', products[${index}])" title="Этикетка с брендом (MNT)">MNT</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet();
      setInterval(fetchDataFromGoogleSheet, 30000);
    });
  </script>
</body>
