<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Печать этикеток — TSC DA220 с детальным редактором</title>
  
  <!-- Библиотеки -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #111827;
      --card-bg: #1F2937;
      --accent-color: #2563EB;
      --accent-hover: #1D4ED8;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --border-color: #374151;
      --radius: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .app-container { max-width: 1020px; width: 100%; }
    
    .page-header { 
      margin-bottom: 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .page-title { font-size: 26px; font-weight: 700; color: #FFFFFF; }
    .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: #065F46;
      color: #34D399;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 6px;
      font-weight: 500;
    }

    .top-editors-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background-color: #111827;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 24px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 16px 24px;
      font-size: 14px;
      color: #E5E7EB;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }

    .code-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .actions-cell { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background-color: #374151; color: #F3F4F6; }
    .btn-secondary:hover { background-color: #4B5563; }
    .btn-success { background-color: #059669; }
    .btn-success:hover { background-color: #047857; }

    /* Модальное окно редактора */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease-in-out;
      z-index: 1000;
      padding: 20px;
    }

    .modal-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .editor-modal-card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-modal);
      width: 100%; max-width: 1050px;
      max-height: 94vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #111827; }
    .modal-title { font-size: 18px; font-weight: 600; color: #FFFFFF; }
    .modal-close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
    
    .editor-modal-body {
      padding: 24px;
      display: grid;
      grid-template-columns: 480px 1fr;
      gap: 24px;
      overflow-y: auto;
      background-color: #111827;
      align-items: start;
    }
    @media (max-width: 900px) { .editor-modal-body { grid-template-columns: 1fr; } }

    .controls-pane { background: #1F2937; padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); max-height: 60vh; overflow-y: auto; }
    .controls-pane h3 { font-size: 14px; margin-bottom: 12px; color: #60A5FA; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .component-section {
      background: #111827;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .component-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .component-header h4 { font-size: 13px; color: #34D399; margin: 0; }
    .lock-label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .lock-label input { cursor: pointer; }

    .control-group { margin-bottom: 6px; font-size: 11px; }
    .control-group label { display: flex; justify-content: space-between; color: var(--text-muted); margin-bottom: 2px; }
    .control-group input[type="range"] { width: 100%; accent-color: var(--accent-color); cursor: pointer; }

    .preview-pane {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #182234;
      padding: 20px;
      border-radius: 8px;
      border: 1px dashed var(--border-color);
      position: sticky;
      top: 0;
    }
    .preview-pane span.hint { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

    .export-box {
      margin-top: 16px;
      background: #111827;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }
    .export-box label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .export-box textarea {
      width: 100%;
      height: 120px;
      background: #1F2937;
      border: 1px solid var(--border-color);
      color: #34D399;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 4px;
      resize: none;
    }

    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #111827; }

    /* Этикетка 100x80 мм */
    .industrial-label {
      width: 100mm;
      height: 80mm;
      background-color: #FFFFFF;
      color: #000000;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      border: 1px solid #D1D5DB;
      position: relative;
      overflow: hidden;
    }

    .label-element {
      position: absolute;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .text-layer span {
      background-color: #FFFFFF;
      padding: 0 6px;
      display: inline-block;
    }

    .barcode-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; }
    .barcode-wrapper svg { max-width: 100%; display: block; }

    @page { size: 100mm 80mm landscape; margin: 0; }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .app-container, .modal-backdrop { display: none !important; }
      #printContainer, #printContainer * { visibility: visible !important; }
      #printContainer {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        position: absolute !important;
        left: 0 !important; top: 0 !important;
        width: 100mm !important; height: 80mm !important;
        background: #FFFFFF !important;
      }
      #printContainer .industrial-label { border: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <div>
        <h1 class="page-title">🖨️ Друк етикеток (TSC DA220)</h1>
        <p class="page-subtitle">Лист: FI Station KOVALCHYK Y. (Авто-обновление каждые 30 сек)</p>
        <div class="status-badge" id="statusBadge">🟡 Подключение к базам данных...</div>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet()">🔄 Обновить сейчас</button>
      </div>
    </header>

    <div class="top-editors-bar">
      <button class="btn btn-secondary" onclick="openEditor('cs')">⚙️ Редактор CS (Обычные)</button>
      <button class="btn btn-success" onclick="openEditor('mnt')">⚙️ Редактор MNT (С брендом)</button>
    </div>

    <main class="card">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Serial Number (SN)</th>
              <th>Part Number (PN)</th>
              <th>Brand</th>
              <th style="width: 150px; text-align: right;">Печать (CS / MNT)</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="5" style="text-align: center; padding: 30px;">Загрузка данных...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="editorModal">
    <div class="editor-modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="editorModalTitle">Редактор этикетки</h2>
        <button class="modal-close-btn" onclick="closeEditor()">&times;</button>
      </div>
      
      <div class="editor-modal-body">
        <div>
          <div class="controls-pane" id="controlsPaneContainer"></div>
          
          <div class="export-box">
            <label>📋 Параметры конфигурации:</label>
            <textarea id="paramsExportField" readonly onclick="this.select();"></textarea>
          </div>
        </div>

        <div class="preview-pane">
          <span class="hint">Живой предпросмотр (100x80 мм)</span>
          <div id="livePreviewContainer"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="resetCurrentEditor()">Сбросить</button>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-secondary" onclick="closeEditor()">Закрыть</button>
          <button class="btn" onclick="printFromEditor()">🖨️ Печать</button>
        </div>
      </div>
    </div>
  </div>

  <div id="printContainer" style="display: none;"></div>

  <script>
    const SUPABASE_URL = 'https://xgjggfnfgrmkuclgjmih.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MLyF6CMVplwDyDqSeDnSBA__RakJscC';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = 'products_db';
    const COLUMN_PN = 'tpv_pn';
    const COLUMN_SN = 'panel_sn';
    const COLUMN_BRAND = 'brand';

    const SHEET_ID = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
    const GID = '0';

    let products = [];
    let activeEditorType = 'cs';
    let sampleProduct = { sn: "GBV270331B6X00LC0WTG5BM0027", pn: "750GBV270331B6N000", brand: "SAMPLE BRAND" };

    const tableBody = document.getElementById('productsTableBody');
    const editorModal = document.getElementById('editorModal');

    // ТОЧНЫЕ И ЕДИНЫЕ ИСТОЧНИКИ ПРАВДЫ ДЛЯ КООРДИНАТ
    const defaultConfigs = {
      cs: {
        h_pn_locked: true, h_pn_x: 0, h_pn_y: -10, h_pn_h: 0, h_pn_f: 17, h_pn_sy: 1.3,
        bc_pn_locked: true, bc_pn_x: 0, bc_pn_y: -17, bc_pn_h: 60,
        txt_pn_locked: true, txt_pn_x: 0, txt_pn_y: -30, txt_pn_h: 12, txt_pn_f: 20, txt_pn_sy: 1.3,
        h_sn_locked: true, h_sn_x: 0, h_sn_y: -30, h_sn_h: 0, h_sn_f: 18, h_sn_sy: 1.4,
        bc_sn_locked: true, bc_sn_x: 0, bc_sn_y: -40, bc_sn_h: 90,
        txt_sn_locked: false, txt_sn_x: 0, txt_sn_y: -40, txt_sn_h: 0, txt_sn_f: 17, txt_sn_sy: 1.3
      },
      mnt: {
        brand_locked: true,
        brand_x: 119,
        brand_y: 3,
        brand_h: 0,
        brand_f: 14,
        brand_sy: 1.6,
        h_pn_locked: true,
        h_pn_x: 0,
        h_pn_y: -30,
        h_pn_h: 0,
        h_pn_f: 18,
        h_pn_sy: 1.2,
        bc_pn_locked: true,
        bc_pn_x: 0,
        bc_pn_y: -30,
        bc_pn_h: 60,
        txt_pn_locked: true,
        txt_pn_x: 0,
        txt_pn_y: -30,
        txt_pn_h: 3,
        txt_pn_f: 20,
        txt_pn_sy: 1.6,
        h_sn_locked: false,
        h_sn_x: 0,
        h_sn_y: -20,
        h_sn_h: 0,
        h_sn_f: 18,
        h_sn_sy: 1.4,
        bc_sn_locked: true,
        bc_sn_x: 0,
        bc_sn_y: -30,
        bc_sn_h: 80,
        txt_sn_locked: true,
        txt_sn_x: 0,
        txt_sn_y: -40,
        txt_sn_h: 0,
        txt_sn_f: 17,
        txt_sn_sy: 1.8
      }
    };

    // Функция всегда возвращает актуальные параметры (сначала проверяя DOM-инпуты, а при их отсутствии — дефолтный конфиг)
    function getParams(type) {
      const cfg = defaultConfigs[type];
      const p = {};
      for (const key in cfg) {
        const el = document.getElementById(`${type}_${key}`);
        if (el) {
          if (el.type === 'checkbox') {
            p[key] = el.checked;
          } else if (key.endsWith('_sy')) {
            p[key] = parseFloat(el.value);
          } else {
            p[key] = parseInt(el.value);
          }
        } else {
          p[key] = cfg[key];
        }
      }
      return p;
    }

    function renderControlsPane(type) {
      const container = document.getElementById('controlsPaneContainer');
      if (type === 'cs') {
        container.innerHTML = `
          <h3>Редактор CS (Обычные)</h3>
          ${renderComponentControl('cs', 'h_pn', 'Шапка PN', true, true, true, true)}
          ${renderComponentControl('cs', 'bc_pn', 'Штрихкод PN', true, true, false, false)}
          ${renderComponentControl('cs', 'txt_pn', 'Текст PN', true, true, true, true)}
          ${renderComponentControl('cs', 'h_sn', 'Шапка SN', true, true, true, true)}
          ${renderComponentControl('cs', 'bc_sn', 'Штрихкод SN', true, true, false, false)}
          ${renderComponentControl('cs', 'txt_sn', 'Текст SN', true, true, true, true)}
        `;
      } else {
        container.innerHTML = `
          <h3>Редактор MNT (С брендом)</h3>
          ${renderComponentControl('mnt', 'brand', 'Brand', true, true, true, true)}
          ${renderComponentControl('mnt', 'h_pn', 'Шапка PN', true, true, true, true)}
          ${renderComponentControl('mnt', 'bc_pn', 'Штрихкод PN', true, true, false, false)}
          ${renderComponentControl('mnt', 'txt_pn', 'Текст PN', true, true, true, true)}
          ${renderComponentControl('mnt', 'h_sn', 'Шапка SN', true, true, true, true)}
          ${renderComponentControl('mnt', 'bc_sn', 'Штрихкод SN', true, true, false, false)}
          ${renderComponentControl('mnt', 'txt_sn', 'Текст SN', true, true, true, true)}
        `;
      }
    }

    function renderComponentControl(type, idPrefix, title, hasX, hasY, hasFont, hasScaleY) {
      const cfg = defaultConfigs[type];
      const isLockedBool = cfg[`${idPrefix}_locked`];
      const locked = isLockedBool ? 'checked' : '';
      const x = cfg[`${idPrefix}_x`] !== undefined ? cfg[`${idPrefix}_x`] : 0;
      const y = cfg[`${idPrefix}_y`] !== undefined ? cfg[`${idPrefix}_y`] : 0;
      const h = cfg[`${idPrefix}_h`] !== undefined ? cfg[`${idPrefix}_h`] : 12;
      const f = cfg[`${idPrefix}_f`] !== undefined ? cfg[`${idPrefix}_f`] : 14;
      const sy = cfg[`${idPrefix}_sy`] !== undefined ? cfg[`${idPrefix}_sy`] : 1.0;

      return `
        <div class="component-section" id="sec_${type}_${idPrefix}">
          <div class="component-header">
            <h4>${title}</h4>
            <label class="lock-label">
              <input type="checkbox" id="${type}_${idPrefix}_locked" ${locked} onchange="toggleLock('${type}', '${idPrefix}')"> Заблокировать
            </label>
          </div>
          <div class="component-fields" id="fields_${type}_${idPrefix}" style="opacity: ${isLockedBool ? '0.4' : '1'};">
            ${hasX ? `<div class="control-group"><label><span>По горизонтали (X):</span> <strong id="lbl_${type}_${idPrefix}_x">${x}</strong>px</label><input type="range" id="${type}_${idPrefix}_x" min="-150" max="150" value="${x}" oninput="onSliderInput('${type}')" ${isLockedBool ? 'disabled' : ''}></div>` : ''}
            ${hasY ? `<div class="control-group"><label><span>Вертикальная позиция (Y от верха):</span> <strong id="lbl_${type}_${idPrefix}_y">${y}</strong>px</label><input type="range" id="${type}_${idPrefix}_y" min="-100" max="400" value="${y}" oninput="onSliderInput('${type}')" ${isLockedBool ? 'disabled' : ''}></div>` : ''}
            <div class="control-group"><label><span>Высота блока / Отступ:</span> <strong id="lbl_${type}_${idPrefix}_h">${h}</strong>px</label><input type="range" id="${type}_${idPrefix}_h" min="0" max="150" value="${h}" oninput="onSliderInput('${type}')" ${isLockedBool ? 'disabled' : ''}></div>
            ${hasFont ? `<div class="control-group"><label><span>Размер шрифта:</span> <strong id="lbl_${type}_${idPrefix}_f">${f}</strong>pt</label><input type="range" id="${type}_${idPrefix}_f" min="8" max="45" value="${f}" oninput="onSliderInput('${type}')" ${isLockedBool ? 'disabled' : ''}></div>` : ''}
            ${hasScaleY ? `<div class="control-group"><label><span>Растянуть в высоту (ScaleY):</span> <strong id="lbl_${type}_${idPrefix}_sy">${sy}</strong></label><input type="range" id="${type}_${idPrefix}_sy" min="0.5" max="3.0" step="0.1" value="${sy}" oninput="onSliderInput('${type}')" ${isLockedBool ? 'disabled' : ''}></div>` : ''}
          </div>
        </div>
      `;
    }

    function toggleLock(type, idPrefix) {
      const isLocked = document.getElementById(`${type}_${idPrefix}_locked`).checked;
      const fieldsContainer = document.getElementById(`fields_${type}_${idPrefix}`);
      const inputs = fieldsContainer.querySelectorAll('input');
      
      inputs.forEach(input => {
        if (input.type !== 'checkbox') {
          input.disabled = isLocked;
        }
      });
      fieldsContainer.style.opacity = isLocked ? '0.4' : '1';
    }

    function generateLabelMarkup(type, product) {
      const p = getParams(type);
      if (type === 'cs') {
        return `
          <div class="industrial-label">
            <div class="label-element" style="z-index: 1; top: ${p.bc_pn_y}px; transform: translateX(${p.bc_pn_x}px);">
              <div class="barcode-wrapper"><svg id="live_bc_pn"></svg></div>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.h_pn_y}px; transform: translateX(${p.h_pn_x}px);">
              <span style="font-size: ${p.h_pn_f}pt; transform: scaleY(${p.h_pn_sy}); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;">PN</span>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.txt_pn_y}px; transform: translateX(${p.txt_pn_x}px);">
              <span style="font-size: ${p.txt_pn_f}pt; transform: scaleY(${p.txt_pn_sy}); font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.pn)}</span>
            </div>

            <div class="label-element" style="z-index: 1; top: ${p.bc_sn_y}px; transform: translateX(${p.bc_sn_x}px);">
              <div class="barcode-wrapper"><svg id="live_bc_sn"></svg></div>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.h_sn_y}px; transform: translateX(${p.h_sn_x}px);">
              <span style="font-size: ${p.h_sn_f}pt; transform: scaleY(${p.h_sn_sy}); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;">SN</span>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.txt_sn_y}px; transform: translateX(${p.txt_sn_x}px);">
              <span style="font-size: ${p.txt_sn_f}pt; transform: scaleY(${p.txt_sn_sy}); font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.sn)}</span>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="industrial-label">
            <div class="label-element text-layer" style="z-index: 10; top: ${p.brand_y}px; transform: translateX(${p.brand_x}px);">
              <span style="font-size: ${p.brand_f}pt; transform: scaleY(${p.brand_sy}); font-weight: 900; text-transform: uppercase;">${escapeHtml(product.brand)}</span>
            </div>

            <div class="label-element" style="z-index: 1; top: ${p.bc_pn_y}px; transform: translateX(${p.bc_pn_x}px);">
              <div class="barcode-wrapper"><svg id="live_bc_pn"></svg></div>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.h_pn_y}px; transform: translateX(${p.h_pn_x}px);">
              <span style="font-size: ${p.h_pn_f}pt; transform: scaleY(${p.h_pn_sy}); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;">PN</span>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.txt_pn_y}px; transform: translateX(${p.txt_pn_x}px);">
              <span style="font-size: ${p.txt_pn_f}pt; transform: scaleY(${p.txt_pn_sy}); font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.pn)}</span>
            </div>

            <div class="label-element" style="z-index: 1; top: ${p.bc_sn_y}px; transform: translateX(${p.bc_sn_x}px);">
              <div class="barcode-wrapper"><svg id="live_bc_sn"></svg></div>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.h_sn_y}px; transform: translateX(${p.h_sn_x}px);">
              <span style="font-size: ${p.h_sn_f}pt; transform: scaleY(${p.h_sn_sy}); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;">SN</span>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.txt_sn_y}px; transform: translateX(${p.txt_sn_x}px);">
              <span style="font-size: ${p.txt_sn_f}pt; transform: scaleY(${p.txt_sn_sy}); font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.sn)}</span>
            </div>
          </div>
        `;
      }
    }

    function updateLivePreview(prod = sampleProduct) {
      const previewPaneContainer = document.getElementById('livePreviewContainer');
      previewPaneContainer.innerHTML = generateLabelMarkup(activeEditorType, prod);
      
      const p = getParams(activeEditorType);
      try {
        JsBarcode("#live_bc_pn", prod.pn, { format: "CODE128", displayValue: false, margin: 0, background: "transparent", height: p.bc_pn_h, width: 2 });
        JsBarcode("#live_bc_sn", prod.sn, { format: "CODE128", displayValue: false, margin: 0, background: "transparent", height: p.bc_sn_h, width: 2 });
      } catch (e) {}

      document.getElementById('paramsExportField').value = JSON.stringify({ type: activeEditorType, ...p }, null, 2);
    }

    function onSliderInput(type) {
      const p = getParams(type);
      for (let key in p) {
        if (key.endsWith('_locked')) continue;
        const el = document.getElementById(`lbl_${type}_${key}`);
        if (el) el.innerText = p[key];
      }
      updateLivePreview(sampleProduct);
    }

    function openEditor(type, productFromTable = null) {
      activeEditorType = type;
      if (productFromTable) sampleProduct = productFromTable;
      document.getElementById('editorModalTitle').innerText = type === 'cs' ? 'Редактор этикетки: CS (Обычная)' : 'Редактор этикетки: MNT (С брендом)';
      
      renderControlsPane(type);
      editorModal.classList.add('is-open');
      setTimeout(() => { updateLivePreview(sampleProduct); }, 50);
    }

    function closeEditor() { editorModal.classList.remove('is-open'); }

    function resetCurrentEditor() {
      renderControlsPane(activeEditorType);
      onSliderInput(activeEditorType);
    }

    function printFromEditor() {
      const printContainer = document.getElementById('printContainer');
      printContainer.innerHTML = generateLabelMarkup(activeEditorType, sampleProduct);
      
      const p = getParams(activeEditorType);
      try {
        printContainer.querySelector('#live_bc_pn').id = 'print_bc_pn';
        printContainer.querySelector('#live_bc_sn').id = 'print_bc_sn';
        JsBarcode("#print_bc_pn", sampleProduct.pn, { format: "CODE128", displayValue: false, margin: 0, background: "transparent", height: p.bc_pn_h, width: 2 });
        JsBarcode("#print_bc_sn", sampleProduct.sn, { format: "CODE128", displayValue: false, margin: 0, background: "transparent", height: p.bc_sn_h, width: 2 });
      } catch (e) {}

      window.print();
    }

    function parseCSV(str) {
      const arr = [];
      let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    async function getProductFromDatabase(sn) {
      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select(`${COLUMN_PN}, ${COLUMN_BRAND}`)
          .eq(COLUMN_SN, sn)
          .single();

        if (error || !data) return { pn: "NOT_FOUND_IN_DB", brand: "-" };
        return { pn: data[COLUMN_PN] || "N/A", brand: data[COLUMN_BRAND] || "-" };
      } catch (e) {
        return { pn: "DB_ERROR", brand: "ERR" };
      }
    }

    async function fetchDataFromGoogleSheet() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&_nc=${Date.now()}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Ошибка сети Google Sheets');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const rawSnList = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;
          const sn = row[2] ? row[2].trim() : '';
          if (sn && sn.toUpperCase() !== 'SERIAL NUMBER') rawSnList.push(sn);
        }

        const lastSnList = rawSnList.slice(-5).reverse();
        const validItems = [];

        for (const sn of lastSnList) {
          const dbData = await getProductFromDatabase(sn);
          validItems.push({ pn: dbData.pn, brand: dbData.brand, sn: sn });
        }

        products = validItems;
        if (products.length > 0) sampleProduct = products[0];
        renderTable();

        const badge = document.getElementById('statusBadge');
        badge.style.background = '#065F46';
        badge.style.color = '#34D399';
        badge.innerText = `🟢 Синхронизировано (${new Date().toLocaleTimeString()})`;
      } catch (error) {
        console.error(error);
        const badge = document.getElementById('statusBadge');
        badge.style.background = '#991B1B';
        badge.style.color = '#FCA5A5';
        badge.innerText = '🔴 Ошибка связи';
      }
    }

    function renderTable() {
      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">Записей не найдено</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      products.forEach((product, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${index + 1}</strong></td>
          <td class="code-text">${escapeHtml(product.sn)}</td>
          <td class="code-text">${escapeHtml(product.pn)}</td>
          <td><span style="background: #374151; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${escapeHtml(product.brand)}</span></td>
          <td class="actions-cell">
            <button class="btn btn-secondary" onclick="openEditor('cs', products[${index}])" title="Обычная этикетка (CS)">CS</button>
            <button class="btn btn-success" onclick="openEditor('mnt', products[${index}])" title="Этикетка с брендом (MNT)">MNT</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet();
      setInterval(fetchDataFromGoogleSheet, 30000);
    });
  </script>
</body>
</html>
