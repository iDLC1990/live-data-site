<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Друк етикеток — TSC DA220</title>
  
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
        СТИЛІ ІНТЕРФЕЙСУ (ТЕМНА ТЕМА)
        ========================================== */
    :root {
      --bg-color: #111827;
      --card-bg: #1F2937;
      --accent-color: #2563EB;
      --accent-hover: #1D4ED8;
      --brand-color: #059669;
      --brand-hover: #047857;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --border-color: #374151;
      --radius: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .app-container { max-width: 1020px; width: 100%; }
    
    .page-header { 
      margin-bottom: 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .page-title { font-size: 26px; font-weight: 700; color: #FFFFFF; }
    .header-buttons { display: flex; gap: 10px; }

    .sheet-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .sheet-tab-btn {
      background-color: #374151;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sheet-tab-btn.active {
      background-color: var(--accent-color);
      color: #FFFFFF;
      border-color: var(--accent-color);
    }

    .sheet-tab-btn kbd {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .sync-indicator {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sync-indicator.visible { opacity: 1; }
    
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==========================================
        ПАНЕЛЬ РУЧНОГО ВВЕДЕННЯ
        ========================================== */
    .manual-input-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      box-shadow: var(--shadow-lg);
    }

    .manual-input-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #E5E7EB;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .manual-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto auto;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 850px) {
      .manual-form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .form-input {
      background-color: #111827;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      color: #FFFFFF;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent-color);
    }

    .batch-actions-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-lg);
    }

    .batch-info { font-size: 14px; font-weight: 500; color: var(--text-muted); }
    .batch-buttons { display: flex; gap: 12px; }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background-color: #111827;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 20px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 16px 20px;
      font-size: 14px;
      color: #E5E7EB;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }

    .code-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    .actions-cell { 
      display: flex; 
      gap: 10px; 
      justify-content: flex-end; 
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background-color: #374151; color: #F3F4F6; }
    .btn-secondary:hover { background-color: #4B5563; }
    .btn-test { background-color: #111827; border: 1px solid #4B5563; color: #F9FAFB; }
    .btn-test:hover { background-color: #000000; border-color: #9CA3AF; }

    .btn-brand { background-color: var(--brand-color); }
    .btn-brand:hover { background-color: var(--brand-hover); }

    /* ==========================================
        ЕТИКЕТКА TSC DA220 — 100 x 78 мм
        ========================================== */
    .industrial-label {
      width: 100mm;
      height: 78mm;
      position: relative;
      background: #FFFFFF;
      color: #000000;
      padding: 3.2mm 4mm 2.8mm;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      display: block;
      overflow: hidden;
      border: 1px solid #D1D5DB;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background-clip: padding-box;
    }

    .top-divider {
      width: 100%;
      height: 0;
      border-top: 1.5px solid #000000;
      margin: 0 0 2.2mm 0;
    }

    .label-section {
      width: 100%;
      display: block;
      margin: 0;
      padding: 0;
    }

    .label-section + .label-section {
      margin-top: 3.1mm;
    }

    .section-header {
      width: 100%;
      height: 5.5mm;
      display: block;
      position: relative;
      margin: 0 0 1.1mm 0;
      line-height: 5.5mm;
      text-align: center;
    }

    .header-title {
      display: block;
      width: 100%;
      font-size: 16.5pt;
      font-weight: 900;
      line-height: 5.5mm;
      text-align: center;
    }

    .brand-tag {
      position: absolute;
      right: 3.5mm;
      top: 0;
      font-weight: 900;
      font-size: 16.5pt;
      text-transform: uppercase;
      line-height: 5.5mm;
      white-space: nowrap;
    }

    .barcode-box {
      width: 82mm;
      height: 15.5mm;
      margin: 0 auto;
      display: block;
      overflow: hidden;
      text-align: center;
    }

    .barcode-box svg {
      width: auto !important;
      max-width: 100% !important;
      height: 15.5mm !important;
      display: inline-block;
      vertical-align: top;
      shape-rendering: crispEdges;
    }

    .val-pn,
    .val-sn {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      line-height: 1;
      letter-spacing: 0;
      margin: 1.1mm 0 0 0;
    }

    .val-pn {
      font-size: 18pt;
      font-family: Arial, Helvetica, sans-serif;
    }

    .val-sn {
      font-size: 13pt;
      font-family: Arial, Helvetica, sans-serif;
      transform: scale(1, 1.8);
      transform-origin: center top;
      margin-top: 3.5mm;
    }

    /* ==========================================
        ДРУК — РЕАЛЬНИЙ РОЗМІР 100 x 78 мм
        ========================================== */
    @page {
      size: 100mm 78mm;
      margin: 0;
    }

    @media print {
      html, body {
        width: 100mm !important;
        height: auto !important;
        min-width: 100mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        display: block !important;
        overflow: visible !important;
      }

      .app-container {
        display: none !important;
      }

      #printContainer {
        display: block !important;
        position: static !important;
        width: 100mm !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      #printContainer .industrial-label {
        width: 100mm !important;
        height: 78mm !important;
        min-width: 100mm !important;
        min-height: 78mm !important;
        max-width: 100mm !important;
        max-height: 78mm !important;
        padding: 3.2mm 4mm 2.8mm !important;
        margin: 0 !important;
        border: 0 !important;
        box-shadow: none !important;
        box-sizing: border-box !important;
        overflow: hidden !important;
        display: block !important;
        position: relative !important;
        
        page-break-before: always !important;
        page-break-after: always !important;
        page-break-inside: avoid !important;
        break-before: page !important;
        break-after: page !important;
        break-inside: avoid !important;
      }

      #printContainer .industrial-label:first-child {
        page-break-before: avoid !important;
        break-before: avoid !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <div>
        <h1 class="page-title">🖨️ Друк етикеток (TSC DA220)</h1>
      </div>
      <div class="header-buttons">
        <button class="btn btn-test" onclick="printTestLabel()">⬛ Тестовий друк</button>
        <button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet(true)">🔄 Оновити зараз</button>
      </div>
    </header>

    <div class="manual-input-card">
      <div class="manual-input-title">✍️ Ручне введення та друк етикетки</div>
      <div class="manual-form-grid">
        <div class="form-group">
          <label for="manualSn">Serial Number (SN)</label>
          <input type="text" id="manualSn" class="form-input code-text" placeholder="Наприклад: SN12345678">
        </div>
        <div class="form-group">
          <label for="manualPn">Part Number (PN)</label>
          <input type="text" id="manualPn" class="form-input code-text" placeholder="Наприклад: PN98765432">
        </div>
        <div class="form-group">
          <label for="manualBrand">Brand</label>
          <input type="text" id="manualBrand" class="form-input" placeholder="Наприклад: TPV">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <label>&nbsp;</label>
          <button class="btn btn-secondary" onclick="printManual(false)">🖨️ Друк</button>
        </div>
        <div class="form-group" style="justify-content: flex-end;">
          <label>&nbsp;</label>
          <button class="btn btn-brand" onclick="printManual(true)">🖨️ З Brand</button>
        </div>
      </div>
    </div>

    <div class="sheet-tabs">
      <button class="sheet-tab-btn active" id="tabBtn0" onclick="switchSheet('0')">FI    1 <kbd>Alt + 1</kbd></button>
      <button class="sheet-tab-btn" id="tabBtn193025884" onclick="switchSheet('193025884')">FI    2 <kbd>Alt + 2</kbd></button>
      
      <div class="sync-indicator" id="syncIndicator">
        <div class="spinner"></div>
        <span>Синхронізація...</span>
      </div>
    </div>

    <div class="batch-actions-bar">
      <div class="batch-info" id="selectedCountText">Вибрано позицій: 0</div>
      <div class="batch-buttons">
        <button class="btn btn-secondary" id="batchPrintNormalBtn" disabled onclick="printBatch(false)">🖨️ Друк вибраних </button>
        <button class="btn btn-brand" id="batchPrintBrandBtn" disabled onclick="printBatch(true)">🖨️ Друк вибраних з Brand </button>
      </div>
    </div>

    <main class="card">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 40px;"><input type="checkbox" class="custom-checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"></th>
              <th>#</th>
              <th>Serial Number (SN)</th>
              <th>Part Number (PN)</th>
              <th>Brand</th>
              <th style="width: 200px; text-align: right;">Друк</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="6" style="text-align: center; padding: 30px;">Завантаження даних...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="printContainer" style="display: none;"></div>

  <script>
    const SUPABASE_URL = 'https://wtqvaeongxncufvpvvge.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0cXZhZW9uZ3huY3VmdnB2dmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1NDM5MjIsImV4cCI6MjEwMjExOTkyMn0.tRsrb29_b9ev3K75npD5zt_Dz9FMltzaRkdK0RPDn-U';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = 'televisions';
    const COLUMN_PN = 'tpv_pn';
    const COLUMN_SN = 'panel_sn';
    const COLUMN_BRAND = 'brand';

    const SHEET_ID = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
    
    let currentGid = '0';
    let products = [];
    let selectedSerials = new Set();
    let isInitialLoad = true;

    const tableBody = document.getElementById('productsTableBody');
    const printContainer = document.getElementById('printContainer');
    const syncIndicator = document.getElementById('syncIndicator');

    function parseCSV(str) {
      const arr = [];
      let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    async function getProductFromDatabase(sn) {
      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select(`${COLUMN_PN}, ${COLUMN_BRAND}`)
          .eq(COLUMN_SN, sn)
          .limit(1);

        if (error || !data || data.length === 0) {
          const upperSn = sn.toUpperCase();
          if (upperSn.startsWith('TBV') && upperSn.length >= 11) {
            const prefix = upperSn.substring(0, 11);
            return {
              pn: `750${prefix}N000`,
              brand: "PHP[PHP]"
            };
          } else if (upperSn.startsWith('TOV') && upperSn.length >= 11) {
            const prefix = upperSn.substring(0, 11);
            return {
              pn: `730${prefix}N000`,
              brand: "PHP[PHP]"
            };
          }

          return { pn: "NOT_FOUND_IN_DB", brand: "-" };
        }

        const record = data[0];
        return { 
          pn: record[COLUMN_PN] || "N/A", 
          brand: record[COLUMN_BRAND] || "-" 
        };
      } catch (e) {
        return { pn: "DB_ERROR", brand: "ERR" };
      }
    }

    async function switchSheet(gid) {
      if (currentGid === gid) return;
      currentGid = gid;
      
      document.querySelectorAll('.sheet-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tabBtn${gid}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 30px;">Завантаження даних...</td></tr>`;
      }

      await fetchDataFromGoogleSheet(false);
    }

    async function fetchDataFromGoogleSheet(showIndicator = false) {
      try {
        if (showIndicator || isInitialLoad) {
          syncIndicator.classList.add('visible');
        }

        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${currentGid}&_nc=${Date.now()}`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error('Помилка Google Таблиці');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const rawSnList = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;

          const sn = row[2] ? row[2].trim() : '';
          if (sn && sn.toUpperCase() !== 'SERIAL NUMBER') {
            rawSnList.push(sn);
          }
        }

        const lastSnList = rawSnList.slice(-10).reverse();
        const validItems = [];

        for (const sn of lastSnList) {
          const dbData = await getProductFromDatabase(sn);
          validItems.push({ 
            pn: dbData.pn, 
            brand: dbData.brand, 
            sn: sn 
          });
        }

        products = validItems;
        renderTable();
        updateBatchBar();
      } catch (error) {
        console.warn('Мережа або база тимчасово недоступні.');
      } finally {
        isInitialLoad = false;
        syncIndicator.classList.remove('visible');
      }
    }

    function renderTable() {
      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">Записів із таблиці не завантажено. Скористайтеся ручним введенням вище.</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      products.forEach((product, index) => {
        const isChecked = selectedSerials.has(product.sn);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleRowSelection(${index}, this)"></td>
          <td><strong>${index + 1}</strong></td>
          <td class="code-text">${escapeHtml(product.sn)}</td>
          <td class="code-text">${escapeHtml(product.pn)}</td>
          <td><span style="background: #374151; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${escapeHtml(product.brand)}</span></td>
          <td class="actions-cell">
            <button class="btn" onclick="printSingle(${index}, false)" title="Друк 2 копії">🖨️ </button>
            <button class="btn btn-brand" onclick="printSingle(${index}, true)" title="Друк 2 копії з Brand">🖨️  Brand</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function toggleRowSelection(index, checkbox) {
      const product = products[index];
      if (!product) return;

      if (checkbox.checked) {
        selectedSerials.add(product.sn);
      } else {
        selectedSerials.delete(product.sn);
      }
      updateBatchBar();
    }

    function toggleSelectAll(selectAllCheckbox) {
      products.forEach((product) => {
        if (selectAllCheckbox.checked) {
          selectedSerials.add(product.sn);
        } else {
          selectedSerials.delete(product.sn);
        }
      });
      renderTable();
      updateBatchBar();
    }

    function updateBatchBar() {
      const count = selectedSerials.size;
      document.getElementById('selectedCountText').innerText = `Вибрано позицій: ${count}`;
      const btnNorm = document.getElementById('batchPrintNormalBtn');
      const btnBrand = document.getElementById('batchPrintBrandBtn');
      
      if (count > 0) {
        btnNorm.removeAttribute('disabled');
        btnBrand.removeAttribute('disabled');
      } else {
        btnNorm.setAttribute('disabled', 'true');
        btnBrand.setAttribute('disabled', 'true');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function printTestLabel() {
      printContainer.innerHTML = `
        <div class="industrial-label">
          <div class="top-divider"></div>
          <div class="label-section">
            <div class="section-header"><span class="header-title">PN:</span></div>
            <div class="barcode-box"><svg id="testPN"></svg></div>
            <div class="val-pn">TEST-PN-100X78</div>
          </div>
          <div class="label-section">
            <div class="section-header"><span class="header-title">SN:</span></div>
            <div class="barcode-box"><svg id="testSN"></svg></div>
            <div class="val-sn">TEST-SN-27082026</div>
          </div>
        </div>
      `;
      JsBarcode('#testPN', 'TEST-PN-100X78', { format: 'CODE128B', displayValue: false, margin: 0, height: 48, width: 1.18, flat: true, lineColor: '#000' });
      JsBarcode('#testSN', 'TEST-SN-27082026', { format: 'CODE128B', displayValue: false, margin: 0, height: 48, width: 0.92, flat: true, lineColor: '#000' });
      prepareAndPrint();
    }

    function printManual(includeBrand) {
      const sn = document.getElementById('manualSn').value.trim();
      const pn = document.getElementById('manualPn').value.trim();
      const brand = document.getElementById('manualBrand').value.trim() || '-';

      if (!sn || !pn) {
        alert('Будь ласка, заповніть Serial Number та Part Number!');
        return;
      }

      const manualProduct = { sn, pn, brand };
      printContainer.innerHTML = buildLabelsHTML([manualProduct], includeBrand);
      renderBarcodesInContainer('#printContainer');
      prepareAndPrint();
    }

    function buildLabelsHTML(itemsList, includeBrand) {
      let html = '';
      itemsList.forEach((product, idx) => {
        for (let copy = 0; copy < 2; copy++) {
          html += `
            <div class="industrial-label">
              <div class="top-divider"></div>

              <div class="label-section">
                <div class="section-header">
                  <span class="header-title">PN:</span>
                  ${includeBrand ? `<span class="brand-tag">${escapeHtml(product.brand)}</span>` : ''}
                </div>
                <div class="barcode-box">
                  <svg id="barcodePN_${idx}_${copy}"></svg>
                </div>
                <div class="val-pn">${escapeHtml(product.pn)}</div>
              </div>

              <div class="label-section">
                <div class="section-header">
                  <span class="header-title">SN:</span>
                </div>
                <div class="barcode-box">
                  <svg id="barcodeSN_${idx}_${copy}"></svg>
                </div>
                <div class="val-sn">${escapeHtml(product.sn)}</div>
              </div>
            </div>
          `;
        }
      });
      return html;
    }

    function renderBarcodesInContainer(containerSelector) {
      const container = document.querySelector(containerSelector);
      if (!container) return;

      container.querySelectorAll('.industrial-label').forEach((label) => {
        const svgPn = label.querySelector('[id^="barcodePN_"]');
        const svgSn = label.querySelector('[id^="barcodeSN_"]');
        
        if (svgPn && svgSn) {
          const pnVal = label.querySelector('.val-pn').innerText;
          const snVal = label.querySelector('.val-sn').innerText;
          
          JsBarcode(svgPn, pnVal, {
            format: "CODE128B",
            displayValue: false,
            margin: 0,
            height: 48,
            width: 1.18,
            flat: true,
            lineColor: "#000000"
          });

          JsBarcode(svgSn, snVal, {
            format: "CODE128B",
            displayValue: false,
            margin: 0,
            height: 48,
            width: 0.92,
            flat: true,
            lineColor: "#000000"
          });
        }
      });
    }

    function prepareAndPrint() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setTimeout(() => window.print(), 120);
        });
      });
    }

    function printSingle(index, includeBrand) {
      const product = products[index];
      if (!product) return;

      printContainer.innerHTML = buildLabelsHTML([product], includeBrand);
      renderBarcodesInContainer('#printContainer');
      prepareAndPrint();
    }

    function printBatch(includeBrand) {
      if (selectedSerials.size === 0) return;

      const itemsToPrint = [];
      products.forEach(product => {
        if (selectedSerials.has(product.sn)) {
          itemsToPrint.push(product);
        }
      });

      if (itemsToPrint.length === 0) return;

      printContainer.innerHTML = buildLabelsHTML(itemsToPrint, includeBrand);
      renderBarcodesInContainer('#printContainer');
      prepareAndPrint();

      selectedSerials.clear();
      renderTable();
      updateBatchBar();
    }

    document.addEventListener('keydown', (e) => {
      if (e.altKey) {
        if (e.key === '1') {
          e.preventDefault();
          switchSheet('0');
        } else if (e.key === '2') {
          e.preventDefault();
          switchSheet('193025884');
        }
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
        e.preventDefault(); 
        if (products.length > 0) {
          if (selectedSerials.size > 0) {
            printBatch(false);
          } else {
            printSingle(0, false);
          }
        }
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet(true);

      setInterval(() => {
        fetchDataFromGoogleSheet(false);
      }, 5000);
    });
  </script>
</body>
</html>
