<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прямий друк етикеток — TSC DA220</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
        СТИЛІ ІНТЕРФЕЙСУ (ТЕМНА ТЕМА)
        ========================================== */
    :root {
      --bg-color: #111827;
      --card-bg: #1F2937;
      --accent-color: #2563EB;
      --accent-hover: #1D4ED8;
      --brand-color: #059669;
      --brand-hover: #047857;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --border-color: #374151;
      --radius: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .app-container { max-width: 1020px; width: 100%; }
    
    .page-header { 
      margin-bottom: 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .page-title { font-size: 26px; font-weight: 700; color: #FFFFFF; }
    .header-buttons { display: flex; gap: 10px; flex-wrap: wrap; }

    .sheet-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .sheet-tab-btn {
      background-color: #374151;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sheet-tab-btn.active {
      background-color: var(--accent-color);
      color: #FFFFFF;
      border-color: var(--accent-color);
    }

    .sheet-tab-btn kbd {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .sync-indicator {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sync-indicator.visible { opacity: 1; }
    
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .batch-actions-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-lg);
    }

    .batch-info { font-size: 14px; font-weight: 500; color: var(--text-muted); }
    .batch-buttons { display: flex; gap: 12px; }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background-color: #111827;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 20px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 16px 20px;
      font-size: 14px;
      color: #E5E7EB;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }

    .code-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    .actions-cell { 
      display: flex; 
      gap: 10px; 
      justify-content: flex-end; 
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background-color: #374151; color: #F3F4F6; }
    .btn-secondary:hover { background-color: #4B5563; }
    .btn-test { background-color: #111827; border: 1px solid #4B5563; color: #F9FAFB; }
    .btn-test:hover { background-color: #000000; border-color: #9CA3AF; }
    .btn-brand { background-color: var(--brand-color); }
    .btn-brand:hover { background-color: var(--brand-hover); }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <div>
        <h1 class="page-title">🖨️ Друк етикеток (TSC DA220)</h1>
      </div>
      <div class="header-buttons">
        <button class="btn btn-secondary" id="connectPrinterBtn" onclick="initSerialPort()">🔌 Підключити принтер</button>
        <button class="btn btn-test" onclick="printTestLabel()">⬛ Тестовий друк</button>
        <button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet(true)">🔄 Оновити зараз</button>
      </div>
    </header>

    <div class="sheet-tabs">
      <button class="sheet-tab-btn active" id="tabBtn0" onclick="switchSheet('0')">FI 1 <kbd>Alt + 1</kbd></button>
      <button class="sheet-tab-btn" id="tabBtn193025884" onclick="switchSheet('193025884')">FI 2 <kbd>Alt + 2</kbd></button>
      
      <div class="sync-indicator" id="syncIndicator">
        <div class="spinner"></div>
        <span>Синхронізація...</span>
      </div>
    </div>

    <div class="batch-actions-bar">
      <div class="batch-info" id="selectedCountText">Вибрано позицій: 0</div>
      <div class="batch-buttons">
        <button class="btn btn-secondary" id="batchPrintNormalBtn" disabled onclick="printBatch(false)">🖨️ Друк вибраних</button>
        <button class="btn btn-brand" id="batchPrintBrandBtn" disabled onclick="printBatch(true)">🖨️ Друк вибраних з Brand</button>
      </div>
    </div>

    <main class="card">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 40px;"><input type="checkbox" class="custom-checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"></th>
              <th>#</th>
              <th>Serial Number (SN)</th>
              <th>Part Number (PN)</th>
              <th>Brand</th>
              <th style="width: 200px; text-align: right;">Друк</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="6" style="text-align: center; padding: 30px;">Завантаження даних...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://xgjggfnfgrmkuclgjmih.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MLyF6CMVplwDyDqSeDnSBA__RakJscC';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = 'products_db';
    const COLUMN_PN = 'tpv_pn';
    const COLUMN_SN = 'panel_sn';
    const COLUMN_BRAND = 'brand';

    const SHEET_ID = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
    
    let currentGid = '0';
    let products = [];
    let selectedSerials = new Set();
    let isInitialLoad = true;
    let serialPort = null;

    const tableBody = document.getElementById('productsTableBody');
    const syncIndicator = document.getElementById('syncIndicator');

    // ПІДКЛЮЧЕННЯ ДО ПРИНТЕРА ЧЕРЕЗ WEB SERIAL API
    async function initSerialPort() {
      if (!('serial' in navigator)) {
        alert('Ваш браузер не підтримує Web Serial API. Використовуйте Google Chrome або Microsoft Edge.');
        return;
      }

      try {
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 9600 });
        updatePrinterStatus(true);
      } catch (error) {
        console.error('Помилка підключення до порту:', error);
        alert('Не вдалося підключитися до принтера.');
      }
    }

    function updatePrinterStatus(isConnected) {
      const btn = document.getElementById('connectPrinterBtn');
      if (isConnected) {
        btn.innerHTML = '✅ Принтер підключено';
        btn.style.background = 'var(--brand-color)';
      } else {
        btn.innerHTML = '🔌 Підключити принтер';
        btn.style.background = '';
      }
    }

    async function sendTSPL(tsplData) {
      if (!serialPort) {
        await initSerialPort();
        if (!serialPort) return false;
      }

      try {
        const writer = serialPort.writable.getWriter();
        const encoder = new TextEncoder();
        await writer.write(encoder.encode(tsplData));
        writer.releaseLock();
        return true;
      } catch (err) {
        console.error('Помилка передачі даних на принтер:', err);
        alert('Зв’язок із принтером втрачено. Будь ласка, перепідключіть його.');
        serialPort = null;
        updatePrinterStatus(false);
        return false;
      }
    }

    function parseCSV(str) {
      const arr = [];
      let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    async function getProductFromDatabase(sn) {
      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select(`${COLUMN_PN}, ${COLUMN_BRAND}`)
          .eq(COLUMN_SN, sn)
          .single();

        if (error || !data) {
          const upperSn = sn.toUpperCase();
          if (upperSn.startsWith('TBV') && upperSn.length >= 12) {
            const prefix = upperSn.substring(0, 12);
            return { pn: `750${prefix}N000`, brand: "PHP[PHP]" };
          } else if (upperSn.startsWith('TOV') && upperSn.length >= 12) {
            const prefix = upperSn.substring(0, 12);
            return { pn: `730${prefix}N000`, brand: "PHP[PHP]" };
          }
          return { pn: "NOT_FOUND_IN_DB", brand: "-" };
        }
        return { 
          pn: data[COLUMN_PN] || "N/A", 
          brand: data[COLUMN_BRAND] || "-" 
        };
      } catch (e) {
        return { pn: "DB_ERROR", brand: "ERR" };
      }
    }

    async function switchSheet(gid) {
      if (currentGid === gid) return;
      currentGid = gid;
      
      document.querySelectorAll('.sheet-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tabBtn${gid}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 30px;">Завантаження даних...</td></tr>`;
      }

      await fetchDataFromGoogleSheet(false);
    }

    async function fetchDataFromGoogleSheet(showIndicator = false) {
      try {
        if (showIndicator || isInitialLoad) {
          syncIndicator.classList.add('visible');
        }

        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${currentGid}&_nc=${Date.now()}`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error('Помилка Google Таблиці');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const rawSnList = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;

          const sn = row[2] ? row[2].trim() : '';
          if (sn && sn.toUpperCase() !== 'SERIAL NUMBER') {
            rawSnList.push(sn);
          }
        }

        const lastSnList = rawSnList.slice(-10).reverse();
        const validItems = [];

        for (const sn of lastSnList) {
          const dbData = await getProductFromDatabase(sn);
          validItems.push({ pn: dbData.pn, brand: dbData.brand, sn: sn });
        }

        products = validItems;
        renderTable();
        updateBatchBar();
      } catch (error) {
        console.error('Помилка оновлення:', error);
      } finally {
        isInitialLoad = false;
        syncIndicator.classList.remove('visible');
      }
    }

    function renderTable() {
      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">Записів не знайдено</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      products.forEach((product, index) => {
        const isChecked = selectedSerials.has(product.sn);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleRowSelection(${index}, this)"></td>
          <td><strong>${index + 1}</strong></td>
          <td class="code-text">${escapeHtml(product.sn)}</td>
          <td class="code-text">${escapeHtml(product.pn)}</td>
          <td><span style="background: #374151; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${escapeHtml(product.brand)}</span></td>
          <td class="actions-cell">
            <button class="btn" onclick="printSingle(${index}, false)" title="Друк 2 копії">🖨️</button>
            <button class="btn btn-brand" onclick="printSingle(${index}, true)" title="Друк 2 копії з Brand">🖨️ Brand</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function toggleRowSelection(index, checkbox) {
      const product = products[index];
      if (!product) return;

      if (checkbox.checked) {
        selectedSerials.add(product.sn);
      } else {
        selectedSerials.delete(product.sn);
      }
      updateBatchBar();
    }

    function toggleSelectAll(selectAllCheckbox) {
      products.forEach((product) => {
        if (selectAllCheckbox.checked) {
          selectedSerials.add(product.sn);
        } else {
          selectedSerials.delete(product.sn);
        }
      });
      renderTable();
      updateBatchBar();
    }

    function updateBatchBar() {
      const count = selectedSerials.size;
      document.getElementById('selectedCountText').innerText = `Вибрано позицій: ${count}`;
      const btnNorm = document.getElementById('batchPrintNormalBtn');
      const btnBrand = document.getElementById('batchPrintBrandBtn');
      
      if (count > 0) {
        btnNorm.removeAttribute('disabled');
        btnBrand.removeAttribute('disabled');
      } else {
        btnNorm.setAttribute('disabled', 'true');
        btnBrand.setAttribute('disabled', 'true');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    // ГЕНЕРАЦІЯ TSPL КОДІВ ДЛЯ ПРИНТЕРА TSC DA220 (100x78 мм)
    function buildTSPL(itemsList, includeBrand) {
      let tspl = "";
      itemsList.forEach(product => {
        // У вашому оригінальному коді друкувалося 2 копії для кожного елемента
        for (let copy = 0; copy < 2; copy++) {
          tspl += "SIZE 100 mm, 78 mm\n";
          tspl += "GAP 3 mm, 0 mm\n";
          tspl += "CLS\n";
          
          // Верхня лінія
          tspl += "BOX 32, 24, 768, 28, 2\n";

          // Блок PN
          tspl += `TEXT 40, 45, "3", 0, 1, 1, "PN:"\n`;
          if (includeBrand && product.brand) {
            tspl += `TEXT 550, 45, "3", 0, 1, 1, "${product.brand}"\n`;
          }
          tspl += `BARCODE 40, 95, "128", 55, 0, 0, 2, 5, "${product.pn}"\n`;
          tspl += `TEXT 40, 165, "4", 0, 1, 1, "${product.pn}"\n`;

          // Блок SN
          tspl += `TEXT 40, 260, "3", 0, 1, 1, "SN:"\n`;
          tspl += `BARCODE 40, 310, "128", 55, 0, 0, 2, 5, "${product.sn}"\n`;
          tspl += `TEXT 40, 385, "4", 0, 1, 2, "${product.sn}"\n`;

          tspl += "PRINT 1, 1\n";
        }
      });
      return tspl;
    }

    async function printTestLabel() {
      const testItem = { pn: "TEST-PN-100X78", sn: "TEST-SN-27082026", brand: "PHP[PHP]" };
      const tsplCode = buildTSPL([testItem], true);
      await sendTSPL(tsplCode);
    }

    async function printSingle(index, includeBrand) {
      const product = products[index];
      if (!product) return;

      const tsplCode = buildTSPL([product], includeBrand);
      await sendTSPL(tsplCode);
    }

    async function printBatch(includeBrand) {
      if (selectedSerials.size === 0) return;

      const itemsToPrint = [];
      products.forEach(product => {
        if (selectedSerials.has(product.sn)) {
          itemsToPrint.push(product);
        }
      });

      if (itemsToPrint.length === 0) return;

      const tsplCode = buildTSPL(itemsToPrint, includeBrand);
      const success = await sendTSPL(tsplCode);

      if (success) {
        selectedSerials.clear();
        renderTable();
        updateBatchBar();
      }
    }

    // ОБРОБКА ГАРЯЧИХ КЛАВІШ
    document.addEventListener('keydown', (e) => {
      if (e.altKey) {
        if (e.key === '1') {
          e.preventDefault();
          switchSheet('0');
        } else if (e.key === '2') {
          e.preventDefault();
          switchSheet('193025884');
        }
      }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
        e.preventDefault();
        if (products.length > 0) {
          if (selectedSerials.size > 0) {
            printBatch(false);
          } else {
            printSingle(0, false);
          }
        }
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet(true);
      setInterval(() => fetchDataFromGoogleSheet(false), 5000);
    });
  </script>
</body>
</html>
