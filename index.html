<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Печать этикеток — TSC DA220</title>
  
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
        СТИЛИ ИНТЕРФЕЙСА (ТЕМНАЯ ТЕМА)
        ========================================== */
    :root {
      --bg-color: #111827;
      --card-bg: #1F2937;
      --accent-color: #2563EB;
      --accent-hover: #1D4ED8;
      --brand-color: #059669;
      --brand-hover: #047857;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --border-color: #374151;
      --radius: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .app-container { max-width: 1020px; width: 100%; }
    
    .page-header { 
      margin-bottom: 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .page-title { font-size: 26px; font-weight: 700; color: #FFFFFF; }

    /* Переключатель листов */
    .sheet-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .sheet-tab-btn {
      background-color: #374151;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sheet-tab-btn.active {
      background-color: var(--accent-color);
      color: #FFFFFF;
      border-color: var(--accent-color);
    }

    .sheet-tab-btn kbd {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Индикатор фонового обновления */
    .sync-indicator {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sync-indicator.visible { opacity: 1; }
    
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .batch-actions-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-lg);
    }

    .batch-info {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .batch-buttons {
      display: flex;
      gap: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background-color: #111827;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 20px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 16px 20px;
      font-size: 14px;
      color: #E5E7EB;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }

    .code-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Чекбоксы */
    .custom-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    /* Кнопки и группы действий */
    .actions-cell { 
      display: flex; 
      gap: 16px; 
      justify-content: flex-end; 
      align-items: center;
    }

    .action-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background-color: #374151; color: #F3F4F6; }
    .btn-secondary:hover { background-color: #4B5563; }

    .btn-brand { background-color: var(--brand-color); }
    .btn-brand:hover { background-color: var(--brand-hover); }

    /* Модальное окно просмотра */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease-in-out;
      z-index: 1000;
    }

    .modal-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .modal-card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-modal);
      width: 90%; max-width: 620px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 18px; font-weight: 600; color: #FFFFFF; }
    .modal-close-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
    .modal-body { padding: 24px; display: flex; justify-content: center; align-items: center; background-color: #111827; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; }

    /* ==========================================
        ЭТИКЕТКА 100x80 мм (Ландшафт)
        ========================================== */
    .industrial-label {
      width: 100mm;
      height: 80mm;
      padding: 4mm 6mm;
      background-color: #FFFFFF;
      color: #000000;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: stretch;
      text-align: left;
      border: 1px solid #D1D5DB;
      page-break-after: always;
    }

    .industrial-label:last-child {
      page-break-after: avoid;
    }

    .label-block { 
      display: flex; 
      flex-direction: column; 
      width: 100%; 
      position: relative;
    }

    .label-header-row {
      width: 100%;
      position: relative;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 0.5mm;
    }

    .label-caption { 
      font-weight: 900; 
      font-size: 14pt;
      color: #000000; 
      letter-spacing: 0.5px; 
      text-transform: uppercase; 
      line-height: 1;
    }

    .label-brand-right {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 900;
      font-size: 14pt;
      color: #000000;
      line-height: 1;
    }

    .barcode-wrapper { 
      width: 100%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }
    
    .barcode-wrapper svg { 
      width: 100% !important;
      max-width: 100%; 
      height: 16mm;
      display: block; 
    }

    .label-value-text {
      font-size: 18pt; 
      font-weight: 900;
      font-family: 'Consolas', monospace; 
      color: #000;
      line-height: 1.1; 
      margin-top: 0.5mm;
      text-align: left;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
    }

    /* ==========================================
        НАСТРОЙКИ ДЛЯ ТЕРМОПЕЧАТИ TSC DA220
        ========================================== */
    @page { 
      size: 100mm 80mm landscape; 
      margin: 0; 
    }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .app-container, .modal-backdrop { display: none !important; }
      #printContainer, #printContainer * { visibility: visible !important; }
      #printContainer {
        display: block !important;
        position: absolute !important;
        left: 0 !important; top: 0 !important;
        width: 100mm !important;
        background: #FFFFFF !important;
      }
      #printContainer .industrial-label { border: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <div>
        <h1 class="page-title">🖨️ Друк етикеток (TSC DA220)</h1>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet(true)">🔄 Обновить сейчас</button>
      </div>
    </header>

    <div class="sheet-tabs">
      <button class="sheet-tab-btn active" id="tabBtn0" onclick="switchSheet('0')">Лист 1 <kbd>Alt + 1</kbd></button>
      <button class="sheet-tab-btn" id="tabBtn193025884" onclick="switchSheet('193025884')">Лист 2 <kbd>Alt + 2</kbd></button>
      
      <div class="sync-indicator" id="syncIndicator">
        <div class="spinner"></div>
        <span>Синхронизация...</span>
      </div>
    </div>

    <div class="batch-actions-bar">
      <div class="batch-info" id="selectedCountText">Выбрано позиций: 0</div>
      <div class="batch-buttons">
        <button class="btn btn-secondary" id="batchPrintNormalBtn" disabled onclick="printBatch(false)">🖨️ Печать выбранных (х2)</button>
        <button class="btn btn-brand" id="batchPrintBrandBtn" disabled onclick="printBatch(true)">🖨️ Печать выбранных с Brand (х2)</button>
      </div>
    </div>

    <main class="card">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 40px;"><input type="checkbox" class="custom-checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"></th>
              <th>#</th>
              <th>Serial Number (SN)</th>
              <th>Part Number (PN)</th>
              <th>Brand</th>
              <th style="width: 250px; text-align: right;">Печать (х2) / Просмотр</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="6" style="text-align: center; padding: 30px;">Загрузка данных...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="labelModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitleText">Предпросмотр этикетки</h2>
        <button class="modal-close-btn" id="closeModalCross">&times;</button>
      </div>
      <div class="modal-body" id="modalPreviewBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="closeModalBtn">Закрыть</button>
        <button class="btn" id="printModalBtn">🖨️ Печать</button>
      </div>
    </div>
  </div>

  <div id="printContainer" style="display: none;"></div>

  <script>
    // --- НАСТРОЙКИ SUPABASE ---
    const SUPABASE_URL = 'https://xgjggfnfgrmkuclgjmih.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MLyF6CMVplwDyDqSeDnSBA__RakJscC';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = 'products_db';
    const COLUMN_PN = 'tpv_pn';
    const COLUMN_SN = 'panel_sn';
    const COLUMN_BRAND = 'brand';

    const SHEET_ID = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
    
    let currentGid = '0';
    let products = [];
    let selectedIndices = new Set();
    let modalActiveItem = null;
    let modalActiveBrand = false;
    let isInitialLoad = true;

    const tableBody = document.getElementById('productsTableBody');
    const modal = document.getElementById('labelModal');
    const modalPreviewBody = document.getElementById('modalPreviewBody');
    const printContainer = document.getElementById('printContainer');
    const syncIndicator = document.getElementById('syncIndicator');

    function parseCSV(str) {
      const arr = [];
      let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    async function getProductFromDatabase(sn) {
      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select(`${COLUMN_PN}, ${COLUMN_BRAND}`)
          .eq(COLUMN_SN, sn)
          .single();

        if (error || !data) {
          return { pn: "NOT_FOUND_IN_DB", brand: "-" };
        }
        return { 
          pn: data[COLUMN_PN] || "N/A", 
          brand: data[COLUMN_BRAND] || "-" 
        };
      } catch (e) {
        return { pn: "DB_ERROR", brand: "ERR" };
      }
    }

    async function switchSheet(gid) {
      if (currentGid === gid) return;
      currentGid = gid;
      
      document.querySelectorAll('.sheet-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tabBtn${gid}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 30px;">Загрузка данных с листа...</td></tr>`;
      }

      await fetchDataFromGoogleSheet(false);
    }

    async function fetchDataFromGoogleSheet(showIndicator = false) {
      try {
        if (showIndicator || isInitialLoad) {
          syncIndicator.classList.add('visible');
        }

        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${currentGid}&_nc=${Date.now()}`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error('Не удалось получить данные с сервера Google');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const rawSnList = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;

          const sn = row[2] ? row[2].trim() : '';
          if (sn && sn.toUpperCase() !== 'SERIAL NUMBER') {
            rawSnList.push(sn);
          }
        }

        const lastSnList = rawSnList.slice(-10).reverse();
        const validItems = [];

        for (const sn of lastSnList) {
          const dbData = await getProductFromDatabase(sn);
          validItems.push({ 
            pn: dbData.pn, 
            brand: dbData.brand, 
            sn: sn 
          });
        }

        products = validItems;
        selectedIndices.clear();
        renderTable();
        updateBatchBar();
      } catch (error) {
        console.error('Ошибка фонового обновления:', error);
      } finally {
        isInitialLoad = false;
        syncIndicator.classList.remove('visible');
      }
    }

    function renderTable() {
      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">Записей в таблице не найдено</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      products.forEach((product, index) => {
        const isChecked = selectedIndices.has(index);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleRowSelection(${index}, this)"></td>
          <td><strong>${index + 1}</strong></td>
          <td class="code-text">${escapeHtml(product.sn)}</td>
          <td class="code-text">${escapeHtml(product.pn)}</td>
          <td><span style="background: #374151; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${escapeHtml(product.brand)}</span></td>
          <td class="actions-cell">
            <div class="action-group">
              <button class="btn btn-secondary" onclick="openPreview(${index}, false)" title="Предпросмотр">👁️</button>
              <button class="btn" onclick="printSingle(${index}, false)" title="Сразу печать 2 копии">🖨️ х2</button>
            </div>
            <div class="action-group">
              <button class="btn btn-secondary" onclick="openPreview(${index}, true)" title="Предпросмотр с Brand">👁️</button>
              <button class="btn btn-brand" onclick="printSingle(${index}, true)" title="Сразу печать 2 копии с Brand">🖨️ х2</button>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function toggleRowSelection(index, checkbox) {
      if (checkbox.checked) {
        selectedIndices.add(index);
      } else {
        selectedIndices.delete(index);
      }
      updateBatchBar();
    }

    function toggleSelectAll(selectAllCheckbox) {
      const checkboxes = document.querySelectorAll('#productsTableBody input[type="checkbox"]');
      checkboxes.forEach((cb, idx) => {
        cb.checked = selectAllCheckbox.checked;
        if (selectAllCheckbox.checked) {
          selectedIndices.add(idx);
        } else {
          selectedIndices.delete(idx);
        }
      });
      updateBatchBar();
    }

    function updateBatchBar() {
      const count = selectedIndices.size;
      document.getElementById('selectedCountText').innerText = `Выбрано позиций: ${count}`;
      const btnNorm = document.getElementById('batchPrintNormalBtn');
      const btnBrand = document.getElementById('batchPrintBrandBtn');
      
      if (count > 0) {
        btnNorm.removeAttribute('disabled');
        btnBrand.removeAttribute('disabled');
      } else {
        btnNorm.setAttribute('disabled', 'true');
        btnBrand.setAttribute('disabled', 'true');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function buildLabelsHTML(itemsList, includeBrand) {
      let html = '';
      itemsList.forEach((product, idx) => {
        for (let copy = 0; copy < 2; copy++) {
          html += `
            <div class="industrial-label">
              <div class="label-block">
                <div class="label-header-row">
                  <span class="label-caption">PN</span>
                  ${includeBrand ? `<span class="label-brand-right">${escapeHtml(product.brand)}</span>` : ''}
                </div>
                <div class="barcode-wrapper">
                  <svg class="barcode-pn" data-index="${idx}_${copy}" data-value="${escapeHtml(product.pn)}"></svg>
                </div>
                <div class="label-value-text">${escapeHtml(product.pn)}</div>
              </div>

              <div class="label-block">
                <div class="label-header-row">
                  <span class="label-caption">SN</span>
                </div>
                <div class="barcode-wrapper">
                  <svg class="barcode-sn" data-index="${idx}_${copy}" data-value="${escapeHtml(product.sn)}"></svg>
                </div>
                <div class="label-value-text">${escapeHtml(product.sn)}</div>
              </div>
            </div>
          `;
        }
      });
      return html;
    }

    function renderBarcodesInContainer(containerSelector) {
      const container = document.querySelector(containerSelector);
      if (!container) return;

      container.querySelectorAll('.barcode-pn').forEach(svg => {
        const val = svg.getAttribute('data-value');
        JsBarcode(svg, val, { format: "CODE128", displayValue: false, margin: 0, height: 50, width: 2 });
      });

      container.querySelectorAll('.barcode-sn').forEach(svg => {
        const val = svg.getAttribute('data-value');
        JsBarcode(svg, val, { format: "CODE128", displayValue: false, margin: 0, height: 50, width: 2 });
      });
    }

    function printSingle(index, includeBrand) {
      const product = products[index];
      if (!product) return;

      printContainer.innerHTML = buildLabelsHTML([product], includeBrand);
      renderBarcodesInContainer('#printContainer');
      window.print();
    }

    function printBatch(includeBrand) {
      if (selectedIndices.size === 0) return;

      const itemsToPrint = [];
      selectedIndices.forEach(idx => {
        if (products[idx]) itemsToPrint.push(products[idx]);
      });

      printContainer.innerHTML = buildLabelsHTML(itemsToPrint, includeBrand);
      renderBarcodesInContainer('#printContainer');
      window.print();
    }

    function openPreview(index, includeBrand) {
      const product = products[index];
      if (!product) return;

      modalActiveItem = product;
      modalActiveBrand = includeBrand;

      document.getElementById('modalTitleText').innerText = includeBrand ? 'Предпросмотр (с Brand - 2 копии)' : 'Предпросмотр (Обычная - 2 копии)';

      modalPreviewBody.innerHTML = buildLabelsHTML([product], includeBrand);
      renderBarcodesInContainer('#modalPreviewBody');

      modal.classList.add('is-open');
    }

    function closeModal() { modal.classList.remove('is-open'); }

    document.addEventListener('keydown', (e) => {
      if (e.altKey) {
        if (e.key === '1') {
          e.preventDefault();
          switchSheet('0');
        } else if (e.key === '2') {
          e.preventDefault();
          switchSheet('193025884');
        }
      }
    });

    document.getElementById('closeModalCross').addEventListener('click', closeModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('printModalBtn').addEventListener('click', () => {
      if (modalActiveItem) {
        printSingle(products.indexOf(modalActiveItem), modalActiveBrand);
        closeModal();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet(true);
      setInterval(() => fetchDataFromGoogleSheet(false), 10000);
    });
  </script>
</body>
</html>
