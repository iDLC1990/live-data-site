<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printer Labels - Google Sheets Integration</title>
  
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    /* ==========================================
       СТИЛИ И ТЕМНАЯ ТЕМА
       ========================================== */
    :root {
      --bg-color: #111827;
      --card-bg: #1F2937;
      --accent-color: #2563EB;
      --accent-hover: #1D4ED8;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --border-color: #374151;
      --radius: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .app-container { max-width: 960px; width: 100%; }
    
    .page-header { 
      margin-bottom: 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .page-title { font-size: 26px; font-weight: 700; color: #FFFFFF; }
    .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: #065F46;
      color: #34D399;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 6px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background-color: #111827;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 24px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 16px 24px;
      font-size: 14px;
      color: #E5E7EB;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }

    .code-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Кнопки */
    .actions-cell { display: flex; gap: 8px; justify-content: flex-end; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--accent-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background-color: #374151; color: #F3F4F6; }
    .btn-secondary:hover { background-color: #4B5563; }

    /* Модальное окно */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease-in-out;
      z-index: 1000;
    }

    .modal-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .modal-card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-modal);
      width: 90%; max-width: 580px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 18px; font-weight: 600; color: #FFFFFF; }
    .modal-close-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
    .modal-body { padding: 24px; display: flex; justify-content: center; align-items: center; background-color: #111827; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; }

    /* Этикетка 100x80мм */
    .industrial-label {
      width: 100mm;
      height: 80mm;
      padding: 3mm;
      background-color: #FFFFFF;
      color: #000000;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid #D1D5DB;
    }

    .label-block { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .label-caption { font-weight: 900; color: #000000; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }
    .pn-caption { transform: translateY(-11px); }
    .sn-caption { transform: translateY(12px); }

    .barcode-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; }
    .barcode-wrapper svg { max-width: 100%; display: block; }
    .pn-bc-wrapper { transform: translateY(-1px); }
    .sn-bc-wrapper { transform: translateY(12px); }

    .label-value-pn {
      font-size: 22pt; font-weight: 900;
      font-family: 'Consolas', monospace; color: #000;
      line-height: 1.1; transform: translateY(6px);
    }

    .label-value-sn {
      font-size: 17pt; font-weight: 900;
      font-family: 'Consolas', monospace; color: #000;
      line-height: 1.1; transform: translateY(15px) scaleY(1.8);
    }

    .label-spacer { height: 2mm; width: 100%; }

    /* Настройки печати */
    @page { size: 100mm 80mm landscape; margin: 0; }

    @media print {
      .app-container, .modal-backdrop { display: none !important; }
      #printContainer, #printContainer * { visibility: visible !important; }
      #printContainer {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        position: absolute !important;
        left: 0 !important; top: 0 !important;
        width: 100mm !important; height: 80mm !important;
        background: #FFFFFF !important;
      }
      #printContainer .industrial-label { border: none !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <div>
        <h1 class="page-title">🖨️ Друк етикеток (Google Sheets)</h1>
        <p class="page-subtitle">Автоматичне отримання 5 останніх номерів з листу "FI Station KOVALCHYK Y."</p>
        <div class="status-badge" id="statusBadge">🟢 Связь с Google Таблицей установлена</div>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet()">🔄 Обновить</button>
      </div>
    </header>

    <main class="card">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Part Number (PN)</th>
              <th>Serial Number (SN)</th>
              <th style="width: 140px; text-align: right;">Действия</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="4" style="text-align: center; padding: 30px;">Загрузка данных из Google Таблицы...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="labelModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Предпросмотр этикетки</h2>
        <button class="modal-close-btn" id="closeModalCross">&times;</button>
      </div>
      <div class="modal-body" id="modalPreviewBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="closeModalBtn">Закрыть</button>
        <button class="btn" id="printLabelBtn">🖨 Печать</button>
      </div>
    </div>
  </div>

  <div id="printContainer" style="display: none;"></div>

  <script>
    // URL Google Таблицы (Формат CSV-экспорта конкретного листа)
    const SHEET_ID = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
    const GID = '193025884'; // Лист "FI Station KOVALCHYK Y."
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

    let products = [];

    const tableBody = document.getElementById('productsTableBody');
    const modal = document.getElementById('labelModal');
    const modalPreviewBody = document.getElementById('modalPreviewBody');
    const printContainer = document.getElementById('printContainer');

    // Разбор CSV строки в массив
    function parseCSV(str) {
      const arr = [];
      let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    // Загрузка данных из Гугл Таблицы
    async function fetchDataFromGoogleSheet() {
      try {
        const response = await fetch(CSV_URL);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        // Фильтруем строки: берем только те, где есть Serial Number в колонке C (индекс 2)
        const validItems = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const sn = row[2] ? row[2].trim() : '';
          
          if (sn && sn !== 'SERIAL NUMBER') {
            // PN можно извлекать из маски SN или использовать базовую модель
            const pn = extractPNFromSN(sn);
            validItems.push({ pn, sn });
          }
        }

        // Берем 5 самых последних записей из таблицы
        products = validItems.slice(-5).reverse();

        renderTable();
        document.getElementById('statusBadge').style.background = '#065F46';
        document.getElementById('statusBadge').innerText = `🟢 Синхронизировано (${new Date().toLocaleTimeString()})`;
      } catch (error) {
        console.error('Ошибка загрузки Google Таблицы:', error);
        document.getElementById('statusBadge').style.background = '#991B1B';
        document.getElementById('statusBadge').innerText = '🔴 Ошибка доступа к Google Таблице';
      }
    }

    // Функция авто-генерации PN по коду SN (при необходимости)
    function extractPNFromSN(sn) {
      if (sn.length >= 12) {
        return "750" + sn.substring(0, 10) + "N000";
      }
      return sn;
    }

    function renderTable() {
      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 20px;">Нет данных в Гугл Таблице</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      products.forEach((product, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${index + 1}</strong></td>
          <td class="code-text">${escapeHtml(product.pn)}</td>
          <td class="code-text">${escapeHtml(product.sn)}</td>
          <td class="actions-cell">
            <button class="btn btn-secondary" onclick="openPrintModal(${index})" title="Просмотр">👁️</button>
            <button class="btn" onclick="directPrint(${index})" title="Печать на Citizen CL-S700">🖨️</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function generateLabelHTML(pn, sn, suffix = '') {
      return `
        <div class="industrial-label">
          <div class="label-block">
            <span class="label-caption pn-caption">PN</span>
            <div class="barcode-wrapper pn-bc-wrapper">
              <svg id="barcodePN_${suffix}"></svg>
            </div>
            <span class="label-value-pn">${escapeHtml(pn)}</span>
          </div>

          <div class="label-spacer"></div>

          <div class="label-block">
            <span class="label-caption sn-caption">SN</span>
            <div class="barcode-wrapper sn-bc-wrapper">
              <svg id="barcodeSN_${suffix}"></svg>
            </div>
            <span class="label-value-sn">${escapeHtml(sn)}</span>
          </div>
        </div>
      `;
    }

    // ПРЯМАЯ ПЕЧАТЬ (по значку 🖨️)
    function directPrint(index) {
      const product = products[index];
      if (!product) return;

      printContainer.innerHTML = generateLabelHTML(product.pn, product.sn, 'print');

      const barcodeOptsPN = { format: "CODE128", displayValue: false, margin: 0, height: 52, width: 1.5 };
      const barcodeOptsSN = { format: "CODE128", displayValue: false, margin: 0, height: 72, width: 1.5 };

      JsBarcode("#barcodePN_print", product.pn, barcodeOptsPN);
      JsBarcode("#barcodeSN_print", product.sn, barcodeOptsSN);

      window.print();
    }

    // ПРОСМОТР В МОДАЛЬНОМ ОКНЕ (по значку 👁️)
    function openPrintModal(index) {
      const product = products[index];
      if (!product) return;

      modalPreviewBody.innerHTML = generateLabelHTML(product.pn, product.sn, 'preview');
      printContainer.innerHTML = generateLabelHTML(product.pn, product.sn, 'print');

      const barcodeOptsPN = { format: "CODE128", displayValue: false, margin: 0, height: 52, width: 1.5 };
      const barcodeOptsSN = { format: "CODE128", displayValue: false, margin: 0, height: 72, width: 1.5 };

      JsBarcode("#barcodePN_preview", product.pn, barcodeOptsPN);
      JsBarcode("#barcodePN_print", product.pn, barcodeOptsPN);

      JsBarcode("#barcodeSN_preview", product.sn, barcodeOptsSN);
      JsBarcode("#barcodeSN_print", product.sn, barcodeOptsSN);

      modal.classList.add('is-open');
    }

    function closeModal() { modal.classList.remove('is-open'); }

    document.getElementById('closeModalCross').addEventListener('click', closeModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('printLabelBtn').addEventListener('click', () => window.print());

    // Инициализация загрузки при открытии страницы
    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet();
      // Авто-обновление каждые 10 секунд
      setInterval(fetchDataFromGoogleSheet, 10000);
    });
  </script>
</body>
</html>
