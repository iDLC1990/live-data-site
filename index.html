<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Печать этикеток — TSC DA220</title>
  
  <!-- Библиотеки -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #111827;
      --card-bg: #1F2937;
      --accent-color: #2563EB;
      --accent-hover: #1D4ED8;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --border-color: #374151;
      --radius: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .app-container { max-width: 1020px; width: 100%; }
    
    .page-header { 
      margin-bottom: 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .page-title { font-size: 26px; font-weight: 700; color: #FFFFFF; }
    .page-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: #065F46;
      color: #34D399;
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 6px;
      font-weight: 500;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background-color: #111827;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 24px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 16px 24px;
      font-size: 14px;
      color: #E5E7EB;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }

    .code-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .actions-cell { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background-color: #374151; color: #F3F4F6; }
    .btn-secondary:hover { background-color: #4B5563; }
    .btn-success { background-color: #059669; }
    .btn-success:hover { background-color: #047857; }

    /* Этикетка 100x80 мм для экрана и печати */
    .industrial-label {
      width: 100mm;
      height: 80mm;
      background-color: #FFFFFF;
      color: #000000;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }

    .label-element {
      position: absolute;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .text-layer span {
      background-color: #FFFFFF;
      padding: 0 6px;
      display: inline-block;
    }

    .barcode-wrapper { width: 100%; display: flex; justify-content: center; align-items: center; }
    .barcode-wrapper svg { max-width: 100%; display: block; }

    @page { size: 100mm 80mm landscape; margin: 0; }

    /* Скрываем контейнер печати на экране, показываем только при вызове window.print() */
    #printContainer { display: none; }

    @media print {
      body { background: #ffffff !important; color: #000000 !important; }
      .app-container { display: none !important; }
      #printContainer {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        position: absolute !important;
        left: 0 !important; top: 0 !important;
        width: 100mm !important; height: 80mm !important;
        background: #FFFFFF !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <div>
        <h1 class="page-title">🖨️ Друк етикеток (TSC DA220)</h1>
        <p class="page-subtitle">Лист: FI Station KOVALCHYK Y. (Авто-обновление каждые 30 сек)</p>
        <div class="status-badge" id="statusBadge">🟡 Подключение к базам данных...</div>
      </div>
      <div>
        <button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet()">🔄 Обновить сейчас</button>
      </div>
    </header>

    <main class="card">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Serial Number (SN)</th>
              <th>Part Number (PN)</th>
              <th>Brand</th>
              <th style="width: 150px; text-align: right;">Печать</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="5" style="text-align: center; padding: 30px;">Загрузка данных...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Скрытый контейнер для генерации и отправки на принтер -->
  <div id="printContainer"></div>

  <script>
    const SUPABASE_URL = 'https://xgjggfnfgrmkuclgjmih.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MLyF6CMVplwDyDqSeDnSBA__RakJscC';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = 'products_db';
    const COLUMN_PN = 'tpv_pn';
    const COLUMN_SN = 'panel_sn';
    const COLUMN_BRAND = 'brand';

    const SHEET_ID = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
    const GID = '0';

    let products = [];
    const tableBody = document.getElementById('productsTableBody');

    // ЖЕСТКО ЗАШИТЫЕ ПАРАМЕТРЫ КООРДИНАТ И СТИЛЕЙ
    const configs = {
      cs: {
        h_pn_x: 0, h_pn_y: -10, h_pn_f: 17, h_pn_sy: 1.3,
        bc_pn_x: 0, bc_pn_y: -17, bc_pn_h: 60,
        txt_pn_x: 0, txt_pn_y: -30, txt_pn_f: 20, txt_pn_sy: 1.3,
        h_sn_x: 0, h_sn_y: -30, h_sn_f: 18, h_sn_sy: 1.4,
        bc_sn_x: 0, bc_sn_y: -40, bc_sn_h: 90,
        txt_sn_x: 0, txt_sn_y: -40, txt_sn_f: 17, txt_sn_sy: 1.3
      },
      mnt: {
        brand_x: 119, brand_y: 3, brand_f: 14, brand_sy: 1.6,
        h_pn_x: 0, h_pn_y: -30, h_pn_f: 18, h_pn_sy: 1.2,
        bc_pn_x: 0, bc_pn_y: -30, bc_pn_h: 60,
        txt_pn_x: 0, txt_pn_y: -30, txt_pn_f: 20, txt_pn_sy: 1.6,
        h_sn_x: 0, h_sn_y: -20, h_sn_f: 18, h_sn_sy: 1.4,
        bc_sn_x: 0, bc_sn_y: -30, bc_sn_h: 80,
        txt_sn_x: 0, txt_sn_y: -40, txt_sn_f: 17, txt_sn_sy: 1.8
      }
    };

    function generateLabelMarkup(type, product) {
      const p = configs[type];
      if (type === 'cs') {
        return `
          <div class="industrial-label">
            <div class="label-element" style="z-index: 1; top: ${p.bc_pn_y}px; transform: translateX(${p.bc_pn_x}px);">
              <div class="barcode-wrapper"><svg id="print_bc_pn"></svg></div>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.h_pn_y}px; transform: translateX(${p.h_pn_x}px);">
              <span style="font-size: ${p.h_pn_f}pt; transform: scaleY(${p.h_pn_sy}); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;">PN</span>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.txt_pn_y}px; transform: translateX(${p.txt_pn_x}px);">
              <span style="font-size: ${p.txt_pn_f}pt; transform: scaleY(${p.txt_pn_sy}); font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.pn)}</span>
            </div>

            <div class="label-element" style="z-index: 1; top: ${p.bc_sn_y}px; transform: translateX(${p.bc_sn_x}px);">
              <div class="barcode-wrapper"><svg id="print_bc_sn"></svg></div>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.h_sn_y}px; transform: translateX(${p.h_sn_x}px);">
              <span style="font-size: ${p.h_sn_f}pt; transform: scaleY(${p.h_sn_sy}); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;">SN</span>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.txt_sn_y}px; transform: translateX(${p.txt_sn_x}px);">
              <span style="font-size: ${p.txt_sn_f}pt; transform: scaleY(${p.txt_sn_sy}); font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.sn)}</span>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="industrial-label">
            <div class="label-element text-layer" style="z-index: 10; top: ${p.brand_y}px; transform: translateX(${p.brand_x}px);">
              <span style="font-size: ${p.brand_f}pt; transform: scaleY(${p.brand_sy}); font-weight: 900; text-transform: uppercase;">${escapeHtml(product.brand)}</span>
            </div>

            <div class="label-element" style="z-index: 1; top: ${p.bc_pn_y}px; transform: translateX(${p.bc_pn_x}px);">
              <div class="barcode-wrapper"><svg id="print_bc_pn"></svg></div>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.h_pn_y}px; transform: translateX(${p.h_pn_x}px);">
              <span style="font-size: ${p.h_pn_f}pt; transform: scaleY(${p.h_pn_sy}); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;">PN</span>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.txt_pn_y}px; transform: translateX(${p.txt_pn_x}px);">
              <span style="font-size: ${p.txt_pn_f}pt; transform: scaleY(${p.txt_pn_sy}); font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.pn)}</span>
            </div>

            <div class="label-element" style="z-index: 1; top: ${p.bc_sn_y}px; transform: translateX(${p.bc_sn_x}px);">
              <div class="barcode-wrapper"><svg id="print_bc_sn"></svg></div>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.h_sn_y}px; transform: translateX(${p.h_sn_x}px);">
              <span style="font-size: ${p.h_sn_f}pt; transform: scaleY(${p.h_sn_sy}); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;">SN</span>
            </div>
            <div class="label-element text-layer" style="z-index: 10; top: ${p.txt_sn_y}px; transform: translateX(${p.txt_sn_x}px);">
              <span style="font-size: ${p.txt_sn_f}pt; transform: scaleY(${p.txt_sn_sy}); font-weight: 900; font-family: 'Consolas', monospace; line-height: 1.1;">${escapeHtml(product.sn)}</span>
            </div>
          </div>
        `;
      }
    }

    // Прямая печать выбранного товара
    function printLabel(type, index) {
      const product = products[index];
      if (!product) return;

      const printContainer = document.getElementById('printContainer');
      printContainer.innerHTML = generateLabelMarkup(type, product);
      
      const p = configs[type];
      try {
        JsBarcode("#print_bc_pn", product.pn, { format: "CODE128", displayValue: false, margin: 0, background: "transparent", height: p.bc_pn_h, width: 2 });
        JsBarcode("#print_bc_sn", product.sn, { format: "CODE128", displayValue: false, margin: 0, background: "transparent", height: p.bc_sn_h, width: 2 });
      } catch (e) {
        console.error("Ошибка генерации штрихкода", e);
      }

      window.print();
    }

    function parseCSV(str) {
      const arr = [];
      let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    async function getProductFromDatabase(sn) {
      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select(`${COLUMN_PN}, ${COLUMN_BRAND}`)
          .eq(COLUMN_SN, sn)
          .single();

        if (error || !data) return { pn: "NOT_FOUND_IN_DB", brand: "-" };
        return { pn: data[COLUMN_PN] || "N/A", brand: data[COLUMN_BRAND] || "-" };
      } catch (e) {
        return { pn: "DB_ERROR", brand: "ERR" };
      }
    }

    async function fetchDataFromGoogleSheet() {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}&_nc=${Date.now()}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Ошибка сети Google Sheets');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const rawSnList = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;
          const sn = row[2] ? row[2].trim() : '';
          if (sn && sn.toUpperCase() !== 'SERIAL NUMBER') rawSnList.push(sn);
        }

        const lastSnList = rawSnList.slice(-5).reverse();
        const validItems = [];

        for (const sn of lastSnList) {
          const dbData = await getProductFromDatabase(sn);
          validItems.push({ pn: dbData.pn, brand: dbData.brand, sn: sn });
        }

        products = validItems;
        renderTable();

        const badge = document.getElementById('statusBadge');
        badge.style.background = '#065F46';
        badge.style.color = '#34D399';
        badge.innerText = `🟢 Синхронизировано (${new Date().toLocaleTimeString()})`;
      } catch (error) {
        console.error(error);
        const badge = document.getElementById('statusBadge');
        badge.style.background = '#991B1B';
        badge.style.color = '#FCA5A5';
        badge.innerText = '🔴 Ошибка связи';
      }
    }

    function renderTable() {
      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 20px;">Записей не найдено</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      products.forEach((product, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><strong>${index + 1}</strong></td>
          <td class="code-text">${escapeHtml(product.sn)}</td>
          <td class="code-text">${escapeHtml(product.pn)}</td>
          <td><span style="background: #374151; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${escapeHtml(product.brand)}</span></td>
          <td class="actions-cell">
            <button class="btn btn-secondary" onclick="printLabel('cs', ${index})" title="Печать CS">CS</button>
            <button class="btn btn-success" onclick="printLabel('mnt', ${index})" title="Печать MNT">MNT</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet();
      setInterval(fetchDataFromGoogleSheet, 30000);
    });
  </script>
</body>
</html>
