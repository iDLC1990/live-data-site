<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Друк етикеток — TSC DA220</title>
  
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ==========================================
        СТИЛІ ІНТЕРФЕЙСУ (ТЕМНА ТЕМА)
        ========================================== */
    :root {
      --bg-color: #111827;
      --card-bg: #1F2937;
      --accent-color: #2563EB;
      --accent-hover: #1D4ED8;
      --brand-color: #059669;
      --brand-hover: #047857;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
      --border-color: #374151;
      --radius: 12px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      line-height: 1.5;
    }

    .app-container { max-width: 1020px; width: 100%; }
    
    .page-header { 
      margin-bottom: 28px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }
    .page-title { font-size: 26px; font-weight: 700; color: #FFFFFF; }
    
    .header-buttons { display: flex; gap: 10px; }

    .sheet-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: center;
    }

    .sheet-tab-btn {
      background-color: #374151;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sheet-tab-btn.active {
      background-color: var(--accent-color);
      color: #FFFFFF;
      border-color: var(--accent-color);
    }

    .sheet-tab-btn kbd {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      margin-left: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .sync-indicator {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sync-indicator.visible { opacity: 1; }
    
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .batch-actions-bar {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px 20px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-lg);
    }

    .batch-info { font-size: 14px; font-weight: 500; color: var(--text-muted); }
    .batch-buttons { display: flex; gap: 12px; }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .table-container { width: 100%; overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; }
    .data-table th {
      background-color: #111827;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 20px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
      padding: 16px 20px;
      font-size: 14px;
      color: #E5E7EB;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .data-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.03); }

    .code-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    .actions-cell { 
      display: flex; 
      gap: 16px; 
      justify-content: flex-end; 
      align-items: center;
    }

    .action-group { display: flex; gap: 6px; align-items: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background-color: var(--accent-color);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-secondary { background-color: #374151; color: #F3F4F6; }
    .btn-secondary:hover { background-color: #4B5563; }
    .btn-test { background-color: #111827; border: 1px solid #4B5563; color: #F9FAFB; }
    .btn-test:hover { background-color: #000000; border-color: #9CA3AF; }

    .btn-brand { background-color: var(--brand-color); }
    .btn-brand:hover { background-color: var(--brand-hover); }

    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease-in-out;
      z-index: 1000;
    }

    .modal-backdrop.is-open { opacity: 1; pointer-events: auto; }

    .modal-card {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-modal);
      width: 90%; max-width: 580px;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 18px; font-weight: 600; color: #FFFFFF; }
    .modal-close-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; align-items: center; max-height: 75vh; overflow-y: auto; background-color: #111827; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; }

    /* ==========================================
        ТОЧНИЙ МАКЕТ ЕТИКЕТКИ ТА ТОЧНІ КООРДИНАТИ (100x78 mm)
        ========================================== */
    .industrial-label {
      width: 100mm;
      height: 78mm;
      background-color: #FFFFFF;
      color: #000000;
      position: relative;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      border: 1px solid #D1D5DB;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .test-fill-label {
      width: 100mm !important;
      height: 78mm !important;
      padding: 0 !important;
      margin: 0 !important;
      border: none !important;
      overflow: hidden !important;
    }

    .top-border {
      position: absolute;
      top: 3mm;
      left: 3mm;
      width: 94mm;
      border-top: 2.5px solid #000000;
    }

    /* PN Блок (Верхній) */
    .pn-caption {
      position: absolute;
      top: 5.5mm;
      left: 0;
      width: 100mm;
      text-align: center;
      font-size: 13pt;
      font-weight: 900;
      line-height: 1;
    }

    .label-brand-right {
      position: absolute;
      top: 5.5mm;
      right: 5mm;
      font-weight: 900;
      font-size: 11pt;
      line-height: 1;
      text-transform: uppercase;
    }

    .pn-barcode-wrapper {
      position: absolute;
      top: 12mm;
      left: 11mm;
      width: 78mm;
      height: 15mm;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pn-barcode-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: crispEdges;
    }

    .label-value-pn {
      position: absolute;
      top: 28.5mm;
      left: 0;
      width: 100mm;
      font-size: 20pt;
      font-weight: 900;
      text-align: center;
      line-height: 1;
      letter-spacing: -0.3px;
    }

    /* SN Блок (Нижній) — НАЛАШТУВАННЯ З ЗНІМКУ OBRAZ_7.PNG */
    .sn-caption {
      position: absolute;
      top: 41mm;
      left: 0;
      width: 100mm;
      text-align: center;
      font-size: 13pt;
      font-weight: 900;
      line-height: 1;
    }

    /* Точні параметри з вашої програми: X=8.5mm, Y=47.8mm, Width=77.6mm, Height=12.8mm */
    .sn-barcode-wrapper {
      position: absolute;
      left: 8.5mm;
      top: 47.8mm;
      width: 77.6mm;
      height: 12.8mm;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .sn-barcode-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
      shape-rendering: crispEdges;
    }

    .label-value-sn {
      position: absolute;
      top: 62.5mm;
      left: 0;
      width: 100mm;
      font-size: 19pt;
      font-weight: 900;
      font-family: 'Arial Narrow', Arial, sans-serif;
      text-align: center;
      line-height: 1;
      transform: scaleX(0.82);
      transform-origin: center;
      white-space: nowrap;
    }

    /* ==========================================
        ДРУК НА TSC DA220
        ========================================== */
    @page { 
      size: 100mm 78mm landscape; 
      margin: 0 !important; 
    }

    @media print {
      html, body {
        width: 100mm !important;
        height: 78mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        display: block !important;
        overflow: hidden !important;
      }

      .app-container, 
      .modal-backdrop { 
        display: none !important; 
      }

      #printContainer {
        display: block !important;
        position: static !important;
        width: 100mm !important;
        height: 78mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FFFFFF !important;
        visibility: visible !important;
        overflow: hidden !important;
      }

      #printContainer * {
        visibility: visible !important;
      }

      #printContainer .industrial-label { 
        width: 100mm !important;
        height: 78mm !important;
        max-width: 100mm !important;
        max-height: 78mm !important;
        margin: 0 !important;
        border: none !important; 
        box-shadow: none !important; 
        box-sizing: border-box !important;
        overflow: hidden !important;

        page-break-inside: avoid !important;
        break-inside: avoid !important;
        page-break-after: always !important;
        break-after: page !important;
      }

      #printContainer .test-fill-label {
        width: 100mm !important;
        height: 78mm !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      #printContainer .industrial-label:last-child {
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="page-header">
      <div>
        <h1 class="page-title">🖨️ Друк етикеток (TSC DA220)</h1>
      </div>
      <div class="header-buttons">
        <button class="btn btn-test" onclick="printTestLabel()">⬛ Тестовий друк</button>
        <button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet(true)">🔄 Оновити зараз</button>
      </div>
    </header>

    <div class="sheet-tabs">
      <button class="sheet-tab-btn active" id="tabBtn0" onclick="switchSheet('0')">Лист 1 <kbd>Alt + 1</kbd></button>
      <button class="sheet-tab-btn" id="tabBtn193025884" onclick="switchSheet('193025884')">Лист 2 <kbd>Alt + 2</kbd></button>
      
      <div class="sync-indicator" id="syncIndicator">
        <div class="spinner"></div>
        <span>Синхронізація...</span>
      </div>
    </div>

    <div class="batch-actions-bar">
      <div class="batch-info" id="selectedCountText">Вибрано позицій: 0</div>
      <div class="batch-buttons">
        <button class="btn btn-secondary" id="batchPrintNormalBtn" disabled onclick="printBatch(false)">🖨️ Друк вибраних (х2)</button>
        <button class="btn btn-brand" id="batchPrintBrandBtn" disabled onclick="printBatch(true)">🖨️ Друк вибраних з Brand (х2)</button>
      </div>
    </div>

    <main class="card">
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width: 40px;"><input type="checkbox" class="custom-checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"></th>
              <th>#</th>
              <th>Serial Number (SN)</th>
              <th>Part Number (PN)</th>
              <th>Brand</th>
              <th style="width: 250px; text-align: right;">Друк (х2) / Перегляд</th>
            </tr>
          </thead>
          <tbody id="productsTableBody">
            <tr><td colspan="6" style="text-align: center; padding: 30px;">Завантаження даних...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="labelModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitleText">Попередній перегляд етикетки</h2>
        <button class="modal-close-btn" id="closeModalCross">&times;</button>
      </div>
      <div class="modal-body" id="modalPreviewBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="closeModalBtn">Закрити</button>
        <button class="btn" id="printModalBtn">🖨️ Друк</button>
      </div>
    </div>
  </div>

  <div id="printContainer" style="display: none;"></div>

  <script>
    const SUPABASE_URL = 'https://xgjggfnfgrmkuclgjmih.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MLyF6CMVplwDyDqSeDnSBA__RakJscC';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const TABLE_NAME = 'products_db';
    const COLUMN_PN = 'tpv_pn';
    const COLUMN_SN = 'panel_sn';
    const COLUMN_BRAND = 'brand';

    const SHEET_ID = '10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
    
    let currentGid = '0';
    let products = [];
    let selectedIndices = new Set();
    let modalActiveItem = null;
    let modalActiveBrand = false;
    let isInitialLoad = true;

    const tableBody = document.getElementById('productsTableBody');
    const modal = document.getElementById('labelModal');
    const modalPreviewBody = document.getElementById('modalPreviewBody');
    const printContainer = document.getElementById('printContainer');
    const syncIndicator = document.getElementById('syncIndicator');

    function parseCSV(str) {
      const arr = [];
      let quote = false;
      for (let row = 0, col = 0, c = 0; c < str.length; c++) {
        let cc = str[c], nc = str[c+1];
        arr[row] = arr[row] || [];
        arr[row][col] = arr[row][col] || '';
        if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
        if (cc == '"') { quote = !quote; continue; }
        if (cc == ',' && !quote) { ++col; continue; }
        if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
        if (cc == '\n' && !quote) { ++row; col = 0; continue; }
        if (cc == '\r' && !quote) { ++row; col = 0; continue; }
        arr[row][col] += cc;
      }
      return arr;
    }

    async function getProductFromDatabase(sn) {
      try {
        const { data, error } = await supabaseClient
          .from(TABLE_NAME)
          .select(`${COLUMN_PN}, ${COLUMN_BRAND}`)
          .eq(COLUMN_SN, sn)
          .single();

        if (error || !data) {
          return { pn: "NOT_FOUND_IN_DB", brand: "-" };
        }
        return { 
          pn: data[COLUMN_PN] || "N/A", 
          brand: data[COLUMN_BRAND] || "-" 
        };
      } catch (e) {
        return { pn: "DB_ERROR", brand: "ERR" };
      }
    }

    async function switchSheet(gid) {
      if (currentGid === gid) return;
      currentGid = gid;
      
      document.querySelectorAll('.sheet-tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tabBtn${gid}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 30px;">Завантаження даних...</td></tr>`;
      }

      await fetchDataFromGoogleSheet(false);
    }

    async function fetchDataFromGoogleSheet(showIndicator = false) {
      try {
        if (showIndicator || isInitialLoad) {
          syncIndicator.classList.add('visible');
        }

        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${currentGid}&_nc=${Date.now()}`;
        const response = await fetch(url);
        
        if (!response.ok) throw new Error('Помилка Google Таблиці');
        
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        const rawSnList = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;

          const sn = row[2] ? row[2].trim() : '';
          if (sn && sn.toUpperCase() !== 'SERIAL NUMBER') {
            rawSnList.push(sn);
          }
        }

        const lastSnList = rawSnList.slice(-10).reverse();
        const validItems = [];

        for (const sn of lastSnList) {
          const dbData = await getProductFromDatabase(sn);
          validItems.push({ 
            pn: dbData.pn, 
            brand: dbData.brand, 
            sn: sn 
          });
        }

        products = validItems;
        selectedIndices.clear();
        renderTable();
        updateBatchBar();
      } catch (error) {
        console.error('Помилка оновлення:', error);
      } finally {
        isInitialLoad = false;
        syncIndicator.classList.remove('visible');
      }
    }

    function renderTable() {
      if (products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">Записів не знайдено</td></tr>`;
        return;
      }

      tableBody.innerHTML = '';
      products.forEach((product, index) => {
        const isChecked = selectedIndices.has(index);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleRowSelection(${index}, this)"></td>
          <td><strong>${index + 1}</strong></td>
          <td class="code-text">${escapeHtml(product.sn)}</td>
          <td class="code-text">${escapeHtml(product.pn)}</td>
          <td><span style="background: #374151; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">${escapeHtml(product.brand)}</span></td>
          <td class="actions-cell">
            <div class="action-group">
              <button class="btn btn-secondary" onclick="openPreview(${index}, false)" title="Перегляд">👁️</button>
              <button class="btn" onclick="printSingle(${index}, false)" title="Друк 2 копії">🖨️ х2</button>
            </div>
            <div class="action-group">
              <button class="btn btn-secondary" onclick="openPreview(${index}, true)" title="Перегляд з Brand">👁️</button>
              <button class="btn btn-brand" onclick="printSingle(${index}, true)" title="Друк 2 копії з Brand">🖨️ х2</button>
            </div>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    function toggleRowSelection(index, checkbox) {
      if (checkbox.checked) {
        selectedIndices.add(index);
      } else {
        selectedIndices.delete(index);
      }
      updateBatchBar();
    }

    function toggleSelectAll(selectAllCheckbox) {
      const checkboxes = document.querySelectorAll('#productsTableBody input[type="checkbox"]');
      checkboxes.forEach((cb, idx) => {
        cb.checked = selectAllCheckbox.checked;
        if (selectAllCheckbox.checked) {
          selectedIndices.add(idx);
        } else {
          selectedIndices.delete(idx);
        }
      });
      updateBatchBar();
    }

    function updateBatchBar() {
      const count = selectedIndices.size;
      document.getElementById('selectedCountText').innerText = `Вибрано позицій: ${count}`;
      const btnNorm = document.getElementById('batchPrintNormalBtn');
      const btnBrand = document.getElementById('batchPrintBrandBtn');
      
      if (count > 0) {
        btnNorm.removeAttribute('disabled');
        btnBrand.removeAttribute('disabled');
      } else {
        btnNorm.setAttribute('disabled', 'true');
        btnBrand.setAttribute('disabled', 'true');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function printTestLabel() {
      printContainer.innerHTML = `
        <div class="industrial-label test-fill-label">
          <svg width="100mm" height="78mm" viewBox="0 0 100 78" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="78" fill="#000000" />
            <rect x="2" y="2" width="96" height="74" fill="none" stroke="#ffffff" stroke-width="1" />
            <text x="50" y="38" fill="#ffffff" font-size="7" font-weight="900" font-family="Arial" text-anchor="middle">TEST PRINT</text>
            <text x="50" y="48" fill="#ffffff" font-size="5" font-weight="bold" font-family="Arial" text-anchor="middle">100 x 78 mm</text>
          </svg>
        </div>
      `;
      window.print();
    }

    function buildLabelsHTML(itemsList, includeBrand) {
      let html = '';
      itemsList.forEach((product, idx) => {
        for (let copy = 0; copy < 2; copy++) {
          html += `
            <div class="industrial-label">
              <div class="top-border"></div>

              <span class="pn-caption">PN:</span>
              ${includeBrand ? `<span class="label-brand-right">${escapeHtml(product.brand)}</span>` : ''}
              <div class="pn-barcode-wrapper">
                <svg id="barcodePN_${idx}_${copy}"></svg>
              </div>
              <span class="label-value-pn">${escapeHtml(product.pn)}</span>

              <span class="sn-caption">SN:</span>
              <div class="sn-barcode-wrapper">
                <svg id="barcodeSN_${idx}_${copy}"></svg>
              </div>
              <span class="label-value-sn">${escapeHtml(product.sn)}</span>
            </div>
          `;
        }
      });
      return html;
    }

    /* Налаштування JsBarcode згідно з діалоговим вікном z obraz_7.png */
    function renderBarcodesInContainer(containerSelector) {
      const container = document.querySelector(containerSelector);
      if (!container) return;

      container.querySelectorAll('.industrial-label:not(.test-fill-label)').forEach((label) => {
        const svgPn = label.querySelector('[id^="barcodePN_"]');
        const svgSn = label.querySelector('[id^="barcodeSN_"]');
        
        if (svgPn && svgSn) {
          const pnVal = label.querySelector('.label-value-pn').innerText;
          const snVal = label.querySelector('.label-value-sn').innerText;
          
          // PN Штрихкод (Code 128)
          JsBarcode(svgPn, pnVal, {
            format: "CODE128",
            displayValue: false,
            margin: 0,
            height: 48,
            width: 2,
            flat: true,
            lineColor: "#000000"
          });

          // SN Штрихкод (Точно за налаштуваннями з obraz_7.png: Code 128, Szerokość modułu: 2, Auto)
          JsBarcode(svgSn, snVal, {
            format: "CODE128",
            displayValue: false,
            margin: 0,
            height: 48, // Відповідає висоті 12.8 мм
            width: 2,   // Szerokość modułu: 2
            flat: true,
            lineColor: "#000000"
          });
        }
      });
    }

    function printSingle(index, includeBrand) {
      const product = products[index];
      if (!product) return;

      printContainer.innerHTML = buildLabelsHTML([product], includeBrand);
      renderBarcodesInContainer('#printContainer');
      window.print();
    }

    function printBatch(includeBrand) {
      if (selectedIndices.size === 0) return;

      const itemsToPrint = [];
      selectedIndices.forEach(idx => {
        if (products[idx]) itemsToPrint.push(products[idx]);
      });

      printContainer.innerHTML = buildLabelsHTML(itemsToPrint, includeBrand);
      renderBarcodesInContainer('#printContainer');
      window.print();
    }

    function openPreview(index, includeBrand) {
      const product = products[index];
      if (!product) return;

      modalActiveItem = product;
      modalActiveBrand = includeBrand;

      document.getElementById('modalTitleText').innerText = includeBrand ? 'Перегляд (з Brand - 2 копії)' : 'Перегляд (Звичайна - 2 копії)';

      modalPreviewBody.innerHTML = buildLabelsHTML([product], includeBrand);
      renderBarcodesInContainer('#modalPreviewBody');

      modal.classList.add('is-open');
    }

    function closeModal() { modal.classList.remove('is-open'); }

    document.addEventListener('keydown', (e) => {
      if (e.altKey) {
        if (e.key === '1') {
          e.preventDefault();
          switchSheet('0');
        } else if (e.key === '2') {
          e.preventDefault();
          switchSheet('193025884');
        }
      }
    });

    document.getElementById('closeModalCross').addEventListener('click', closeModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('printModalBtn').addEventListener('click', () => {
      if (modalActiveItem) {
        printSingle(products.indexOf(modalActiveItem), modalActiveBrand);
        closeModal();
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      fetchDataFromGoogleSheet(true);
      setInterval(() => fetchDataFromGoogleSheet(false), 10000);
    });
  </script>
</body>
</html>
