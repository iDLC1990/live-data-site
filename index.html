<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Друк етикеток TSC DA220</title>

  <!--
    JsBarcode використовується тільки для генерації SVG штрих-кодів.
    Якщо бібліотека вже є у вашому проєкті — цей CDN можна прибрати.
  -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    /* ============================================================
       ОСНОВНИЙ UI
       ============================================================ */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    body {
      min-height: 100vh;
    }

    .sheet-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .sheet-tab-btn {
      border: 1px solid #ccc;
      background: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .sheet-tab-btn.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .sheet-tab-btn kbd {
      margin-left: 8px;
      font-size: 11px;
      opacity: 0.7;
    }

    .sync-indicator {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #777;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #ddd;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .batch-actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    .batch-info {
      font-weight: 600;
    }

    .batch-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      border: 0;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #e9ecef;
      color: #222;
    }

    .btn-brand {
      background: #2563eb;
      color: #fff;
    }

    .card {
      margin: 20px;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .table-container {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    .data-table th {
      background: #f8f9fa;
      font-size: 13px;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
    }

    /* ============================================================
       PRINT CONTAINER — НА ЕКРАНІ НЕ ПОКАЗУЄМО
       ============================================================ */

    #printContainer {
      display: none;
    }

    /* ============================================================
       ЕТИКЕТКА
       Фізичний розмір: 100 × 80 мм
       ============================================================ */

    .industrial-label {
      width: 100mm;
      height: 80mm;

      box-sizing: border-box;

      background: #fff;
      color: #000;

      overflow: hidden;

      position: relative;

      font-family: Arial, Helvetica, sans-serif;

      /*
       * Не використовуємо padding у mm, який може створювати
       * додатковий overflow.
       */
      padding: 3mm;
    }

    .label-inner {
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    /* ------------------------------------------------------------
       Верхній блок
       ------------------------------------------------------------ */

    .label-header {
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      min-height: 9mm;
      max-height: 9mm;

      overflow: hidden;
    }

    .label-brand {
      font-size: 4mm;
      line-height: 4.5mm;
      font-weight: 700;

      max-width: 55mm;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .label-type {
      font-size: 2.8mm;
      line-height: 3.2mm;
      font-weight: 600;

      text-align: right;
      white-space: nowrap;
    }

    /* ------------------------------------------------------------
       PN
       ------------------------------------------------------------ */

    .label-pn-block {
      width: 100%;

      text-align: center;

      margin-top: 1mm;

      min-height: 12mm;
      max-height: 12mm;

      overflow: hidden;
    }

    .label-pn-title {
      font-size: 2.6mm;
      line-height: 3mm;
      font-weight: 700;
      text-transform: uppercase;
    }

    .label-pn {
      margin-top: 0.5mm;

      font-size: 6mm;
      line-height: 7mm;

      font-weight: 800;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ------------------------------------------------------------
       SN
       ------------------------------------------------------------ */

    .label-sn-block {
      width: 100%;

      text-align: center;

      margin-top: 1mm;

      min-height: 11mm;
      max-height: 11mm;

      overflow: hidden;
    }

    .label-sn-title {
      font-size: 2.6mm;
      line-height: 3mm;
      font-weight: 700;
      text-transform: uppercase;
    }

    .label-sn {
      margin-top: 0.5mm;

      font-size: 5mm;
      line-height: 6mm;

      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ------------------------------------------------------------
       Штрих-коди
       ------------------------------------------------------------ */

    .label-barcodes {
      flex: 1 1 auto;

      min-height: 0;

      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 5mm;

      overflow: hidden;

      padding-top: 1mm;
    }

    .barcode-block {
      width: 43mm;

      min-width: 0;

      height: 37mm;

      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;

      overflow: hidden;
    }

    .barcode-title {
      height: 4mm;

      font-size: 2.4mm;
      line-height: 3mm;

      font-weight: 700;

      text-align: center;

      white-space: nowrap;
    }

    .barcode-svg {
      display: block;

      width: 42mm !important;
      height: 25mm !important;

      max-width: 42mm;
      max-height: 25mm;

      overflow: hidden;
    }

    .barcode-value {
      width: 42mm;

      height: 6mm;

      margin-top: 0.5mm;

      font-size: 2.7mm;
      line-height: 3.5mm;

      text-align: center;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ------------------------------------------------------------
       Нижній блок
       ------------------------------------------------------------ */

    .label-footer {
      width: 100%;

      height: 5mm;
      min-height: 5mm;
      max-height: 5mm;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      overflow: hidden;
    }

    .label-copy {
      font-size: 2.2mm;
      line-height: 2.5mm;
      color: #444;
    }


    /* ============================================================
       PRINT
       ============================================================ */

    @media print {

      /*
       * Найважливіше правило.
       *
       * Браузеру явно задаємо фізичний формат етикетки.
       */
      @page {
        size: 100mm 80mm;
        margin: 0;
      }

      html,
      body {
        width: 100mm !important;
        height: 80mm !important;

        margin: 0 !important;
        padding: 0 !important;

        overflow: hidden !important;

        background: #fff !important;
      }

      body {
        min-width: 100mm !important;
        max-width: 100mm !important;

        min-height: 80mm !important;
        max-height: none !important;
      }

      /*
       * Ховаємо весь звичайний UI.
       */
      .sheet-tabs,
      .batch-actions-bar,
      .app-container,
      .modal-backdrop,
      main.card,
      body > header,
      body > nav {
        display: none !important;
      }

      /*
       * Контейнер друку — звичайний block.
       *
       * ЖОДНОГО:
       * display:flex
       * position:absolute
       * height:80mm
       * transform
       */
      #printContainer {
        display: block !important;

        position: static !important;

        width: 100mm !important;

        margin: 0 !important;
        padding: 0 !important;

        overflow: visible !important;
      }

      /*
       * КОЖНА етикетка = ОКРЕМА фізична сторінка.
       */
      #printContainer .industrial-label {
        display: block !important;

        position: relative !important;

        width: 100mm !important;
        height: 80mm !important;

        min-width: 100mm !important;
        max-width: 100mm !important;

        min-height: 80mm !important;
        max-height: 80mm !important;

        box-sizing: border-box !important;

        margin: 0 !important;
        padding: 3mm !important;

        overflow: hidden !important;

        background: #fff !important;

        /*
         * Старий синтаксис для Chromium/старих браузерів.
         */
        page-break-before: auto !important;
        page-break-inside: avoid !important;
        page-break-after: always !important;

        /*
         * Новий CSS Fragmentation API.
         */
        break-before: auto !important;
        break-inside: avoid !important;
        break-after: page !important;
      }

      /*
       * Остання етикетка не повинна створювати порожню
       * сторінку після себе.
       */
      #printContainer .industrial-label:last-child {
        page-break-after: avoid !important;
        break-after: avoid !important;
      }

      /*
       * SVG не повинен створити власний overflow.
       */
      #printContainer svg {
        display: block !important;

        max-width: 100% !important;
        overflow: hidden !important;
      }

      /*
       * Примусово прибираємо браузерні/сторонні поля.
       */
      #printContainer *,
      #printContainer *::before,
      #printContainer *::after {
        box-sizing: border-box;
      }
    }
  </style>
</head>

<body>

  <!-- ==========================================================
       ОСНОВНИЙ ІНТЕРФЕЙС
       ========================================================== -->

  <div class="sheet-tabs">

    <button
      class="sheet-tab-btn active"
      id="tabBtn0"
      onclick="switchSheet('0')"
    >
      Лист 1 <kbd>Alt + 1</kbd>
    </button>

    <button
      class="sheet-tab-btn"
      id="tabBtn193025884"
      onclick="switchSheet('193025884')"
    >
      Лист 2 <kbd>Alt + 2</kbd>
    </button>

    <div class="sync-indicator" id="syncIndicator">
      <div class="spinner"></div>
      <span>Синхронизация...</span>
    </div>

  </div>


  <div class="batch-actions-bar">

    <div
      class="batch-info"
      id="selectedCountText"
    >
      Выбрано позиций: 0
    </div>

    <div class="batch-buttons">

      <button
        class="btn btn-secondary"
        id="batchPrintNormalBtn"
        disabled
        onclick="printBatch(false)"
      >
        🖨️ Печать выбранных (х2)
      </button>

      <button
        class="btn btn-brand"
        id="batchPrintBrandBtn"
        disabled
        onclick="printBatch(true)"
      >
        🖨️ Печать выбранных с Brand (х2)
      </button>

    </div>

  </div>


  <main class="card">

    <div class="table-container">

      <table class="data-table">

        <thead>
          <tr>
            <th style="width: 40px;">
              <input
                type="checkbox"
                class="custom-checkbox"
                id="selectAllCheckbox"
                onclick="toggleSelectAll(this)"
              >
            </th>

            <th>#</th>

            <th>Serial Number (SN)</th>

            <th>Part Number (PN)</th>

            <th>Brand</th>

            <th style="width: 250px; text-align: right;">
              Печать (х2) / Просмотр
            </th>
          </tr>
        </thead>

        <tbody id="productsTableBody"></tbody>

      </table>

    </div>

  </main>


  <!-- ==========================================================
       ОТДЕЛЬНИЙ PRINT CONTAINER
       ========================================================== -->

  <div id="printContainer"></div>


  <script>

    /* ============================================================
       ДЕМО-ДАНІ
       ============================================================

       Замініть цей масив своїм API/даними.

       Формат:
       {
         id: number|string,
         sn: string,
         pn: string,
         brand: string
       }
    */

    const products = [
      {
        id: 1,
        sn: 'SN123456789',
        pn: 'PN-100-ABC',
        brand: 'DEMO BRAND'
      },
      {
        id: 2,
        sn: 'SN987654321',
        pn: 'PN-200-XYZ',
        brand: 'ANOTHER BRAND'
      },
      {
        id: 3,
        sn: 'SN555555555',
        pn: 'PN-300-TEST',
        brand: 'TEST BRAND'
      }
    ];


    let currentSheet = '0';


    /* ============================================================
       РЕНДЕР ТАБЛИЦІ
       ============================================================ */

    function renderProducts() {

      const tbody = document.getElementById('productsTableBody');

      if (!products.length) {

        tbody.innerHTML = `
          <tr>
            <td
              colspan="6"
              style="text-align:center;padding:30px;"
            >
              Даних немає
            </td>
          </tr>
        `;

        return;
      }


      tbody.innerHTML = products.map((product, index) => {

        return `
          <tr>

            <td>
              <input
                type="checkbox"
                class="custom-checkbox product-checkbox"
                data-id="${escapeHtml(product.id)}"
                onchange="updateSelectedCount()"
              >
            </td>

            <td>${index + 1}</td>

            <td>${escapeHtml(product.sn)}</td>

            <td>${escapeHtml(product.pn)}</td>

            <td>${escapeHtml(product.brand || '')}</td>

            <td style="text-align:right;">

              <button
                class="btn btn-secondary"
                onclick="printSingle('${escapeJs(product.id)}', false)"
              >
                🖨️ Друк
              </button>

              <button
                class="btn btn-brand"
                onclick="printSingle('${escapeJs(product.id)}', true)"
              >
                🖨️ Brand
              </button>

            </td>

          </tr>
        `;

      }).join('');


      updateSelectedCount();
    }


    /* ============================================================
       ВИБІР
       ============================================================ */

    function toggleSelectAll(checkbox) {

      document
        .querySelectorAll('.product-checkbox')
        .forEach(item => {
          item.checked = checkbox.checked;
        });

      updateSelectedCount();
    }


    function updateSelectedCount() {

      const selected = getSelectedProducts();

      const count = selected.length;

      document.getElementById('selectedCountText').textContent =
        `Выбрано позиций: ${count}`;


      document.getElementById('batchPrintNormalBtn').disabled =
        count === 0;

      document.getElementById('batchPrintBrandBtn').disabled =
        count === 0;
    }


    function getSelectedProducts() {

      const selectedIds = Array.from(
        document.querySelectorAll('.product-checkbox:checked')
      ).map(checkbox => String(checkbox.dataset.id));


      return products.filter(product =>
        selectedIds.includes(String(product.id))
      );
    }


    /* ============================================================
       ПЕРЕМИКАННЯ ЛИСТІВ
       ============================================================ */

    function switchSheet(sheetId) {

      currentSheet = String(sheetId);

      document
        .querySelectorAll('.sheet-tab-btn')
        .forEach(button => {
          button.classList.remove('active');
        });


      const button = document.getElementById(
        `tabBtn${sheetId}`
      );

      if (button) {
        button.classList.add('active');
      }
    }


    /* ============================================================
       ДРУК ОДНІЄЇ ПОЗИЦІЇ
       ============================================================ */

    function printSingle(productId, withBrand = false) {

      const product = products.find(
        item => String(item.id) === String(productId)
      );


      if (!product) {
        console.error('Product not found:', productId);
        return;
      }


      /*
       * x2 — друкуємо дві копії.
       */
      const printItems = [
        product,
        product
      ];


      preparePrint(printItems, withBrand);
    }


    /* ============================================================
       ДРУК ВИБРАНИХ
       ============================================================ */

    function printBatch(withBrand = false) {

      const selected = getSelectedProducts();


      if (!selected.length) {
        alert('Оберіть хоча б одну позицію.');
        return;
      }


      /*
       * Для кожної позиції створюємо 2 етикетки.
       *
       * Наприклад:
       *
       * Product A
       * Product A
       * Product B
       * Product B
       *
       * Кожна буде окремою сторінкою 100×80 мм.
       */

      const printItems = [];

      selected.forEach(product => {

        printItems.push(product);
        printItems.push(product);

      });


      preparePrint(printItems, withBrand);
    }


    /* ============================================================
       ПІДГОТОВКА PRINT DOM
       ============================================================ */

    function preparePrint(items, withBrand) {

      const printContainer =
        document.getElementById('printContainer');


      /*
       * Повністю очищаємо старий друк.
       */
      printContainer.innerHTML = '';


      /*
       * Створюємо кожну етикетку окремим DOM-блоком.
       */
      items.forEach((product, index) => {

        const label = createLabel(
          product,
          withBrand,
          index + 1,
          items.length
        );

        printContainer.appendChild(label);

      });


      /*
       * Даємо браузеру завершити layout/рендер SVG.
       *
       * Особливо важливо для JsBarcode.
       */
      requestAnimationFrame(() => {

        requestAnimationFrame(() => {

          generateBarcodes();

          /*
           * Ще один кадр — після генерації SVG.
           */
          requestAnimationFrame(() => {

            window.print();

          });

        });

      });
    }


    /* ============================================================
       СТВОРЕННЯ ЕТИКЕТКИ
       ============================================================ */

    function createLabel(
      product,
      withBrand,
      copyNumber,
      totalCopies
    ) {

      const label = document.createElement('section');

      label.className = 'industrial-label';


      const brandHtml = withBrand && product.brand
        ? `
          <div class="label-brand">
            ${escapeHtml(product.brand)}
          </div>
        `
        : `
          <div class="label-brand">
            &nbsp;
          </div>
        `;


      label.innerHTML = `

        <div class="label-inner">

          <!-- HEADER -->

          <div class="label-header">

            ${brandHtml}

            <div class="label-type">
              INDUSTRIAL LABEL
            </div>

          </div>


          <!-- PN -->

          <div class="label-pn-block">

            <div class="label-pn-title">
              PART NUMBER
            </div>

            <div class="label-pn">
              ${escapeHtml(product.pn)}
            </div>

          </div>


          <!-- SN -->

          <div class="label-sn-block">

            <div class="label-sn-title">
              SERIAL NUMBER
            </div>

            <div class="label-sn">
              ${escapeHtml(product.sn)}
            </div>

          </div>


          <!-- BARCODES -->

          <div class="label-barcodes">

            <div class="barcode-block">

              <div class="barcode-title">
                PN
              </div>

              <svg
                class="barcode-svg"
                data-barcode="${escapeHtml(product.pn)}"
                data-format="CODE128"
                aria-label="PN barcode"
              ></svg>

              <div class="barcode-value">
                ${escapeHtml(product.pn)}
              </div>

            </div>


            <div class="barcode-block">

              <div class="barcode-title">
                SN
              </div>

              <svg
                class="barcode-svg"
                data-barcode="${escapeHtml(product.sn)}"
                data-format="CODE128"
                aria-label="SN barcode"
              ></svg>

              <div class="barcode-value">
                ${escapeHtml(product.sn)}
              </div>

            </div>

          </div>


          <!-- FOOTER -->

          <div class="label-footer">

            <div class="label-copy">
              ${copyNumber} / ${totalCopies}
            </div>

          </div>

        </div>
      `;


      return label;
    }


    /* ============================================================
       ГЕНЕРАЦІЯ SVG BARCODE
       ============================================================ */

    function generateBarcodes() {

      const barcodes =
        document.querySelectorAll(
          '#printContainer .barcode-svg'
        );


      if (
        typeof JsBarcode === 'undefined'
      ) {

        console.error(
          'JsBarcode library is not loaded.'
        );

        return;
      }


      barcodes.forEach(svg => {

        const value = svg.dataset.barcode;


        if (!value) {
          return;
        }


        /*
         * Важливі параметри:
         *
         * width  — товщина ліній
         * height — фізична висота barcode
         *
         * displayValue:false
         *
         * Текст ми рендеримо окремим HTML-елементом,
         * тому barcode не роздуває висоту SVG.
         */

        JsBarcode(svg, value, {

          format: 'CODE128',

          width: 1.4,

          height: 70,

          displayValue: false,

          margin: 0,

          marginTop: 0,

          marginBottom: 0,

          marginLeft: 0,

          marginRight: 0,

          background: '#ffffff',

          lineColor: '#000000',

          valid: function(valid) {

            if (!valid) {
              console.warn(
                'Invalid barcode:',
                value
              );
            }

          }

        });


        /*
         * Примусово задаємо viewBox, якщо бібліотека його
         * не створила.
         */
        if (!svg.getAttribute('viewBox')) {

          const width =
            svg.getAttribute('width') || 300;

          const height =
            svg.getAttribute('height') || 70;

          svg.setAttribute(
            'viewBox',
            `0 0 ${parseFloat(width)} ${parseFloat(height)}`
          );

        }

      });
    }


    /* ============================================================
       ПІСЛЯ PRINT
       ============================================================ */

    window.addEventListener('afterprint', () => {

      /*
       * Очищаємо print DOM після завершення друку.
       *
       * Це важливо, щоб при наступному друці не залишилися
       * старі етикетки.
       */

      const printContainer =
        document.getElementById('printContainer');

      printContainer.innerHTML = '';

    });


    /* ============================================================
       ESCAPE
       ============================================================ */

    function escapeHtml(value) {

      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    function escapeJs(value) {

      return String(value ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'");

    }


    /* ============================================================
       HOTKEYS
       ============================================================ */

    document.addEventListener('keydown', event => {

      if (!event.altKey) {
        return;
      }


      if (event.key === '1') {

        event.preventDefault();

        switchSheet('0');

      }


      if (event.key === '2') {

        event.preventDefault();

        switchSheet('193025884');

      }

    });


    /* ============================================================
       START
       ============================================================ */

    document.addEventListener('DOMContentLoaded', () => {

      renderProducts();

      const syncIndicator =
        document.getElementById('syncIndicator');

      /*
       * Тут можна залишити вашу реальну синхронізацію/API.
       */

      setTimeout(() => {

        syncIndicator.style.display = 'none';

      }, 500);

    });

  </script>
