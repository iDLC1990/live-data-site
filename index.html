<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Візуальний Редактор Промислових Етикеток</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    :root {
      --bg-dark: #0F172A;
      --panel-bg: #1E293B;
      --border-color: #334155;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Панель керування (зліва) */
    .sidebar {
      width: 380px;
      background-color: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 4px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .control-label {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .control-label span { font-weight: 600; color: var(--text-main); }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="text"] {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
    }

    /* Зона попереднього перегляду (справа) */
    .preview-container {
      flex: 1;
      background-color: #020617;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }

    .preview-hint {
      position: absolute;
      top: 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Макет етикетки */
    .industrial-label {
      background-color: #FFFFFF;
      color: #000000;
      box-sizing: border-box;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transition: all 0.1s ease;
    }

    .label-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .label-caption {
      font-weight: 900;
      color: #000000;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1;
    }

    .barcode-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .barcode-wrapper svg {
      max-width: 100%;
      display: block;
    }

    .label-value {
      font-weight: 900;
      font-family: 'Consolas', 'Courier New', monospace;
      color: #000000;
      letter-spacing: 0.5px;
      word-break: break-all;
      line-height: 1.1;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }

    /* Модальне вікно коду */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      width: 600px;
      max-height: 80vh;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      width: 100%;
      height: 300px;
      background: var(--bg-dark);
      color: #A5F3FC;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      resize: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">🛠️ Візуальний Редактор Етикетки (100x80 мм)</div>
    <button class="btn" onclick="openCodeModal()">Отримати готовий CSS/JS код</button>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      
      <div>
        <div class="section-title">Тестові Дані</div>
        <div class="control-group">
          <label class="control-label">Part Number (PN)</label>
          <input type="text" id="input_pn_text" value="750TBV580CT4AHN000">
        </div>
        <div class="control-group">
          <label class="control-label">Serial Number (SN)</label>
          <input type="text" id="input_sn_text" value="TBV580CT4AHX00Q20XVA2AV1103">
        </div>
      </div>

      <div>
        <div class="section-title">Блок Part Number (PN)</div>
        <div class="control-group">
          <label class="control-label">Розмір шрифту PN: <span id="val_pn_font">22pt</span></label>
          <input type="range" id="pn_font" min="10" max="36" value="22">
        </div>
        <div class="control-group">
          <label class="control-label">Висота штрихкоду PN: <span id="val_pn_bc_h">45px</span></label>
          <input type="range" id="pn_bc_h" min="15" max="120" value="45">
        </div>
        <div class="control-group">
          <label class="control-label">Товщина ліній PN: <span id="val_pn_bc_w">1.5</span></label>
          <input type="range" id="pn_bc_w" min="1" max="3" step="0.1" value="1.5">
        </div>
      </div>

      <div>
        <div class="section-title">Блок Serial Number (SN)</div>
        <div class="control-group">
          <label class="control-label">Розмір шрифту SN: <span id="val_sn_font">18pt</span></label>
          <input type="range" id="sn_font" min="10" max="36" value="18">
        </div>
        <div class="control-group">
          <label class="control-label">Висота штрихкоду SN: <span id="val_sn_bc_h">45px</span></label>
          <input type="range" id="sn_bc_h" min="15" max="120" value="45">
        </div>
        <div class="control-group">
          <label class="control-label">Товщина ліній SN: <span id="val_sn_bc_w">1.5</span></label>
          <input type="range" id="sn_bc_w" min="1" max="3" step="0.1" value="1.5">
        </div>
      </div>

      <div>
        <div class="section-title">Layout & Відступи</div>
        <div class="control-group">
          <label class="control-label">Внутрішній відступ етикетки: <span id="val_padding">3mm</span></label>
          <input type="range" id="label_padding" min="0" max="10" value="3">
        </div>
        <div class="control-group">
          <label class="control-label">Відступ між PN та SN: <span id="val_spacer">2mm</span></label>
          <input type="range" id="label_spacer" min="0" max="10" value="2">
        </div>
      </div>

    </div>

    <div class="preview-container">
      <div class="preview-hint">Масштаб 1:1 (Макет 100mm x 80mm)</div>
      
      <div class="industrial-label" id="label_preview">
        <div class="label-block">
          <span class="label-caption" id="pn_caption">PN</span>
          <div class="barcode-wrapper">
            <svg id="barcodePN"></svg>
          </div>
          <span class="label-value" id="pn_value_display"></span>
        </div>

        <div id="spacer_element"></div>

        <div class="label-block">
          <span class="label-caption" id="sn_caption">SN</span>
          <div class="barcode-wrapper">
            <svg id="barcodeSN"></svg>
          </div>
          <span class="label-value" id="sn_value_display"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="codeModal">
    <div class="modal-content">
      <h3>Згенерований код налаштувань</h3>
      <p style="font-size: 13px; color: var(--text-muted);">Скопіюйте ці CSS та JS параметри у свій проєкт:</p>
      <textarea id="codeOutput" readonly></textarea>
      <div style="display:flex; justify-content: flex-end; gap: 10px;">
        <button class="btn" onclick="closeCodeModal()">Закрити</button>
      </div>
    </div>
  </div>

  <script>
    // Отримання всіх елементів
    const inputs = {
      pn_text: document.getElementById('input_pn_text'),
      sn_text: document.getElementById('input_sn_text'),
      pn_font: document.getElementById('pn_font'),
      pn_bc_h: document.getElementById('pn_bc_h'),
      pn_bc_w: document.getElementById('pn_bc_w'),
      sn_font: document.getElementById('sn_font'),
      sn_bc_h: document.getElementById('sn_bc_h'),
      sn_bc_w: document.getElementById('sn_bc_w'),
      padding: document.getElementById('label_padding'),
      spacer: document.getElementById('label_spacer')
    };

    const preview = {
      label: document.getElementById('label_preview'),
      pnText: document.getElementById('pn_value_display'),
      snText: document.getElementById('sn_value_display'),
      spacer: document.getElementById('spacer_element')
    };

    function updateLabel() {
      // 1. Оновлення текстових значень
      const pnVal = inputs.pn_text.value || "PN_EXAMPLE";
      const snVal = inputs.sn_text.value || "SN_EXAMPLE";
      
      preview.pnText.textContent = pnVal;
      preview.snText.textContent = snVal;

      // 2. Оновлення відображення значень біля бегунків
      document.getElementById('val_pn_font').textContent = inputs.pn_font.value + 'pt';
      document.getElementById('val_pn_bc_h').textContent = inputs.pn_bc_h.value + 'px';
      document.getElementById('val_pn_bc_w').textContent = inputs.pn_bc_w.value;
      
      document.getElementById('val_sn_font').textContent = inputs.sn_font.value + 'pt';
      document.getElementById('val_sn_bc_h').textContent = inputs.sn_bc_h.value + 'px';
      document.getElementById('val_sn_bc_w').textContent = inputs.sn_bc_w.value;

      document.getElementById('val_padding').textContent = inputs.padding.value + 'mm';
      document.getElementById('val_spacer').textContent = inputs.spacer.value + 'mm';

      // 3. Застосування CSS стилів до макету
      preview.label.style.width = '100mm';
      preview.label.style.height = '80mm';
      preview.label.style.padding = `${inputs.padding.value}mm`;

      preview.pnText.style.fontSize = `${inputs.pn_font.value}pt`;
      preview.snText.style.fontSize = `${inputs.sn_font.value}pt`;

      preview.spacer.style.height = `${inputs.spacer.value}mm`;
      preview.spacer.style.width = '100%';

      // 4. Генерація штрихкоду PN
      JsBarcode("#barcodePN", pnVal, {
        format: "CODE128",
        displayValue: false,
        margin: 0,
        height: parseInt(inputs.pn_bc_h.value),
        width: parseFloat(inputs.pn_bc_w.value),
        lineColor: "#000000"
      });

      // 5. Генерація штрихкоду SN
      JsBarcode("#barcodeSN", snVal, {
        format: "CODE128",
        displayValue: false,
        margin: 0,
        height: parseInt(inputs.sn_bc_h.value),
        width: parseFloat(inputs.sn_bc_w.value),
        lineColor: "#000000"
      });
    }

    // Додаємо обробники подій на всі елементи керування
    Object.values(inputs).forEach(input => {
      input.addEventListener('input', updateLabel);
    });

    // Модальне вікно експорту коду
    function openCodeModal() {
      const generatedCode = `/* === ЗГЕНЕРОВАНІ СТИЛІ CSS === */
.industrial-label {
  width: 100mm;
  height: 80mm;
  padding: ${inputs.padding.value}mm;
}

.label-value-pn {
  font-size: ${inputs.pn_font.value}pt;
}

.label-value-sn {
  font-size: ${inputs.sn_font.value}pt;
}

.label-spacer {
  height: ${inputs.spacer.value}mm;
}

/* === ЗГЕНЕРОВАНІ НАЛАШТУВАННЯ JSBARCODE === */
const barcodeOptionsPN = {
  format: "CODE128",
  displayValue: false,
  margin: 0,
  height: ${inputs.pn_bc_h.value}, // Висота штрихкоду PN
  width: ${inputs.pn_bc_w.value},  // Товщина ліній PN
  lineColor: "#000000"
};

const barcodeOptionsSN = {
  format: "CODE128",
  displayValue: false,
  margin: 0,
  height: ${inputs.sn_bc_h.value}, // Висота штрихкоду SN
  width: ${inputs.sn_bc_w.value},  // Товщина ліній SN
  lineColor: "#000000"
};`;

      document.getElementById('codeOutput').value = generatedCode;
      document.getElementById('codeModal').style.display = 'flex';
    }

    function closeCodeModal() {
      document.getElementById('codeModal').style.display = 'none';
    }

    // Ініціалізація при завантаженні
    document.addEventListener('DOMContentLoaded', updateLabel);
  </script>
</body>
</html>
