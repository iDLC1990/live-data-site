<style>

.label-section{width:100%;display:block;margin:0;padding:0}
.label-section+.label-section{margin-top:3.1mm}
.section-header{width:100%;height:5.5mm;display:block;position:relative;margin:0 0 1.1mm;line-height:5.5mm;text-align:center}
.header-title{display:block;width:100%;font-size:16.5pt;font-weight:900;line-height:5.5mm;text-align:center}

<body>
<div class="app-container">
<header class="page-header">
<div><h1 class="page-title">🖨️ Друк етикеток (TSC DA220)</h1></div>
<div class="header-buttons">
<button class="btn btn-test" onclick="printTestLabel()">⬛ Тестовий друк</button>
<button class="btn btn-secondary" onclick="fetchDataFromGoogleSheet(true)">🔄 Оновити зараз</button>
</div>
</header>
<div class="sheet-tabs">
<button class="sheet-tab-btn active" id="tabBtn0" onclick="switchSheet('0')">Лист 1 <kbd>Alt + 1</kbd></button>
<button class="sheet-tab-btn" id="tabBtn193025884" onclick="switchSheet('193025884')">Лист 2 <kbd>Alt + 2</kbd></button>
<div class="sync-indicator" id="syncIndicator"><div class="spinner"></div><span>Синхронізація...</span></div>
</div>
<div class="batch-actions-bar">
<div class="batch-info" id="selectedCountText">Вибрано позицій: 0</div>
<div class="batch-buttons">
<button class="btn btn-secondary" id="batchPrintNormalBtn" disabled onclick="printBatch(false)">🖨️ Друк вибраних (х2)</button>
<button class="btn btn-brand" id="batchPrintBrandBtn" disabled onclick="printBatch(true)">🖨️ Друк вибраних з Brand (х2)</button>
</div>
</div>
<main class="card">
<div class="table-container">
<table class="data-table">
<thead><tr>
<th style="width:40px"><input type="checkbox" class="custom-checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"></th>
<th>#</th><th>Serial Number (SN)</th><th>Part Number (PN)</th><th>Brand</th>
<th style="width:250px;text-align:right">Друк (х2) / Перегляд</th>
</tr></thead>
<tbody id="productsTableBody"><tr><td colspan="6" style="text-align:center;padding:30px">Завантаження даних...</td></tr></tbody>
</table>
</div>
</main>
</div>

<div class="modal-backdrop" id="labelModal">
<div class="modal-card">
<div class="modal-header"><h2 class="modal-title" id="modalTitleText">Попередній перегляд етикетки</h2><button class="modal-close-btn" id="closeModalCross">&times;</button></div>
<div class="modal-body" id="modalPreviewBody"></div>
<div class="modal-footer"><button class="btn btn-secondary" id="closeModalBtn">Закрити</button><button class="btn" id="printModalBtn">🖨️ Друк</button></div>
</div>
</div>

<div id="printContainer" style="display:none"></div>

<script>
const SUPABASE_URL='https://xgjggfnfgrmkuclgjmih.supabase.co';
const SUPABASE_KEY='sb_publishable_MLyF6CMVplwDyDqSeDnSBA__RakJscC';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TABLE_NAME='products_db',COLUMN_PN='tpv_pn',COLUMN_SN='panel_sn',COLUMN_BRAND='brand';
const SHEET_ID='10W03bvKlVFlIUcxsHkzP_v_13gtnYRBmnrrO0ujB1bU';
let currentGid='0',products=[],selectedIndices=new Set(),selectedSNs=new Set(),modalActiveItem=null,modalActiveBrand=false,isInitialLoad=true;

const tableBody=document.getElementById('productsTableBody');
const modal=document.getElementById('labelModal');
const modalPreviewBody=document.getElementById('modalPreviewBody');
const printContainer=document.getElementById('printContainer');
const syncIndicator=document.getElementById('syncIndicator');

function parseCSV(str){
const arr=[];let quote=false;
for(let row=0,col=0,c=0;c<str.length;c++){
let cc=str[c],nc=str[c+1];
arr[row]=arr[row]||[];arr[row][col]=arr[row][col]||'';
if(cc==='"'&&quote&&nc==='"'){arr[row][col]+=cc;++c;continue}
if(cc==='"'){quote=!quote;continue}
if(cc===','&&!quote){++col;continue}
if(cc==='\r'&&nc==='\n'&&!quote){++row;col=0;++c;continue}
if((cc==='\n'||cc==='\r')&&!quote){++row;col=0;continue}
arr[row][col]+=cc;
}
return arr;
}

/* Fallback PN используется ТОЛЬКО если SN реально отсутствует в БД.
   Для ошибок Supabase fallback не применяется. */
function getFallbackPN(sn){
const upperSn=String(sn||'').trim().toUpperCase();
if(!/^(TBV|TOV)[A-Z0-9]+$/.test(upperSn)||upperSn.length<11)return null;
const prefix=upperSn.substring(0,11);
if(upperSn.startsWith('TBV'))return `750${prefix}N000`;
if(upperSn.startsWith('TOV'))return `730${prefix}N000`;
return null;
}

async function getProductFromDatabase(sn){
try{
const {data,error}=await supabaseClient.from(TABLE_NAME).select(`${COLUMN_PN},${COLUMN_BRAND}`).eq(COLUMN_SN,sn).limit(1);
if(error){
console.error('Supabase error:',error);
return {pn:'DB_ERROR',brand:'ERR'};
}
if(!data||data.length===0){
const fallbackPN=getFallbackPN(sn);
return fallbackPN?{pn:fallbackPN,brand:'PHP[PHP]'}:{pn:'NOT_FOUND_IN_DB',brand:'-'};
}
return {pn:data[0][COLUMN_PN]||'N/A',brand:data[0][COLUMN_BRAND]||'-'};
}catch(e){
console.error('Database error:',e);
return {pn:'DB_ERROR',brand:'ERR'};
}
}

async function switchSheet(gid){
if(currentGid===gid)return;
currentGid=gid;
document.querySelectorAll('.sheet-tab-btn').forEach(btn=>btn.classList.remove('active'));
const activeBtn=document.getElementById(`tabBtn${gid}`);
if(activeBtn)activeBtn.classList.add('active');
if(products.length===0)tableBody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px">Завантаження даних...</td></tr>';
await fetchDataFromGoogleSheet(false);
}

async function fetchDataFromGoogleSheet(showIndicator=false){
try{
if(showIndicator||isInitialLoad)syncIndicator.classList.add('visible');

const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${currentGid}&_nc=${Date.now()}`;
const response=await fetch(url);
if(!response.ok)throw new Error('Помилка Google Таблиці');

const rows=parseCSV(await response.text());
const rawSnList=[];
for(let i=1;i<rows.length;i++){
const row=rows[i];
if(!row||row.length<3)continue;
const sn=row[2]?row[2].trim():'';
if(sn&&sn.toUpperCase()!=='SERIAL NUMBER')rawSnList.push(sn);
}

const lastSnList=rawSnList.slice(-10).reverse();
const validItems=[];
for(const sn of lastSnList){
const dbData=await getProductFromDatabase(sn);
validItems.push({pn:dbData.pn,brand:dbData.brand,sn});
}

/* Сохраняем выбор по SN, а не по индексу строки.
   Поэтому автообновление больше не сбрасывает выбранные позиции. */
const availableSNs=new Set(validItems.map(item=>item.sn));
selectedSNs=new Set([...selectedSNs].filter(sn=>availableSNs.has(sn)));

products=validItems;
selectedIndices=new Set(
products.map((product,index)=>selectedSNs.has(product.sn)?index:-1).filter(index=>index>=0)
);

renderTable();
updateBatchBar();
}catch(error){
console.error('Помилка оновлення:',error);
}finally{
isInitialLoad=false;
syncIndicator.classList.remove('visible');
}
}

function renderTable(){
if(products.length===0){
tableBody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:20px">Записів не знайдено</td></tr>';
document.getElementById('selectAllCheckbox').checked=false;
return;
}
tableBody.innerHTML='';
products.forEach((product,index)=>{
const row=document.createElement('tr');
const isChecked=selectedSNs.has(product.sn);
row.innerHTML=`
<td><input type="checkbox" class="custom-checkbox" ${isChecked?'checked':''} onchange="toggleRowSelection(${index},this)"></td>
<td><strong>${index+1}</strong></td>
<td class="code-text">${escapeHtml(product.sn)}</td>
<td class="code-text">${escapeHtml(product.pn)}</td>
<td><span style="background:#374151;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600">${escapeHtml(product.brand)}</span></td>
<td class="actions-cell">
<div class="action-group">
<button class="btn btn-secondary" onclick="openPreview(${index},false)" title="Перегляд">👁️</button>
<button class="btn" onclick="printSingle(${index},false)" title="Друк 2 копії">🖨️ х2</button>
</div>
<div class="action-group">
<button class="btn btn-secondary" onclick="openPreview(${index},true)" title="Перегляд з Brand">👁️</button>
<button class="btn btn-brand" onclick="printSingle(${index},true)" title="Друк 2 копії з Brand">🖨️ х2</button>
</div>
</td>`;
tableBody.appendChild(row);
});
updateSelectAllCheckbox();
}

function toggleRowSelection(index,checkbox){
const product=products[index];
if(!product)return;
if(checkbox.checked)selectedSNs.add(product.sn);
else selectedSNs.delete(product.sn);
selectedIndices=new Set(products.map((p,i)=>selectedSNs.has(p.sn)?i:-1).filter(i=>i>=0));
updateBatchBar();
updateSelectAllCheckbox();
}

function toggleSelectAll(selectAllCheckbox){
if(selectAllCheckbox.checked)products.forEach(product=>selectedSNs.add(product.sn));
else products.forEach(product=>selectedSNs.delete(product.sn));
selectedIndices=new Set(products.map((product,index)=>selectedSNs.has(product.sn)?index:-1).filter(index=>index>=0));
renderTable();
updateBatchBar();
}

function updateSelectAllCheckbox(){
const checkbox=document.getElementById('selectAllCheckbox');
checkbox.checked=products.length>0&&products.every(product=>selectedSNs.has(product.sn));
checkbox.indeterminate=selectedSNs.size>0&&!checkbox.checked;
}

function updateBatchBar(){
const count=selectedSNs.size;
document.getElementById('selectedCountText').innerText=`Вибрано позицій: ${count}`;
document.getElementById('batchPrintNormalBtn').disabled=count===0;
document.getElementById('batchPrintBrandBtn').disabled=count===0;
}

function escapeHtml(text){
const div=document.createElement('div');
div.innerText=String(text??'');
return div.innerHTML;
}

function printTestLabel(){
printContainer.innerHTML=`
<div class="industrial-label">
<div class="top-divider"></div>
<div class="label-section">
<div class="section-header"><span class="header-title">PN:</span></div>
<div class="barcode-box"><svg id="testPN"></svg></div>
<div class="val-pn">TEST-PN-100X78</div>
</div>
<div class="label-section">
<div class="section-header"><span class="header-title">SN:</span></div>
<div class="barcode-box"><svg id="testSN"></svg></div>
<div class="val-sn">TEST-SN-27082026</div>
</div>
</div>`;
JsBarcode('#testPN','TEST-PN-100X78',{format:'CODE128B',displayValue:false,margin:0,height:48,width:1.18,flat:true,lineColor:'#000'});
JsBarcode('#testSN','TEST-SN-27082026',{format:'CODE128B',displayValue:false,margin:0,height:48,width:.92,flat:true,lineColor:'#000'});
prepareAndPrint();
}

function buildLabelsHTML(itemsList,includeBrand){
let html='';
itemsList.forEach((product,idx)=>{
for(let copy=0;copy<2;copy++){
html+=`
<div class="industrial-label">
<div class="top-divider"></div>
<div class="label-section">
<div class="section-header"><span class="header-title">PN:</span>${includeBrand?`<span class="brand-tag">${escapeHtml(product.brand)}</span>`:''}</div>
<div class="barcode-box"><svg id="barcodePN_${idx}_${copy}"></svg></div>
<div class="val-pn">${escapeHtml(product.pn)}</div>
</div>
<div class="label-section">
<div class="section-header"><span class="header-title">SN:</span></div>
<div class="barcode-box"><svg id="barcodeSN_${idx}_${copy}"></svg></div>
<div class="val-sn">${escapeHtml(product.sn)}</div>
</div>
</div>`;
}
});
return html;
}

function renderBarcodesInContainer(containerSelector){
const container=document.querySelector(containerSelector);
if(!container)return;
container.querySelectorAll('.industrial-label').forEach(label=>{
const svgPn=label.querySelector('[id^="barcodePN_"]');
const svgSn=label.querySelector('[id^="barcodeSN_"]');
if(!svgPn||!svgSn)return;
const pnVal=label.querySelector('.val-pn').innerText;
const snVal=label.querySelector('.val-sn').innerText;
JsBarcode(svgPn,pnVal,{format:'CODE128B',displayValue:false,margin:0,height:48,width:1.18,flat:true,lineColor:'#000'});
JsBarcode(svgSn,snVal,{format:'CODE128B',displayValue:false,margin:0,height:48,width:.92,flat:true,lineColor:'#000'});
});
}

function prepareAndPrint(){
requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>window.print(),120)));
}

function printSingle(index,includeBrand){
const product=products[index];
if(!product)return;
printContainer.innerHTML=buildLabelsHTML([product],includeBrand);
renderBarcodesInContainer('#printContainer');
prepareAndPrint();
}

function printBatch(includeBrand){
if(selectedSNs.size===0)return;
const itemsToPrint=products.filter(product=>selectedSNs.has(product.sn));
if(!itemsToPrint.length)return;
printContainer.innerHTML=buildLabelsHTML(itemsToPrint,includeBrand);
renderBarcodesInContainer('#printContainer');
prepareAndPrint();
}

function openPreview(index,includeBrand){
const product=products[index];
if(!product)return;
modalActiveItem=product;
modalActiveBrand=includeBrand;
document.getElementById('modalTitleText').innerText=includeBrand?'Перегляд (з Brand - 2 копії)':'Перегляд (Звичайна - 2 копії)';
modalPreviewBody.innerHTML=buildLabelsHTML([product],includeBrand);
renderBarcodesInContainer('#modalPreviewBody');
modal.classList.add('is-open');
}

function closeModal(){modal.classList.remove('is-open')}

document.addEventListener('keydown',e=>{
if(e.altKey){
if(e.key==='1'){e.preventDefault();switchSheet('0')}
else if(e.key==='2'){e.preventDefault();switchSheet('193025884')}
}
if(e.key==='Escape'&&modal.classList.contains('is-open'))closeModal();
});

document.getElementById('closeModalCross').addEventListener('click',closeModal);
document.getElementById('closeModalBtn').addEventListener('click',closeModal);
document.getElementById('printModalBtn').addEventListener('click',()=>{
if(modalActiveItem){
const index=products.findIndex(p=>p.sn===modalActiveItem.sn);
if(index>=0)printSingle(index,modalActiveBrand);
closeModal();
}
});

document.addEventListener('DOMContentLoaded',()=>{
fetchDataFromGoogleSheet(true);
setInterval(()=>fetchDataFromGoogleSheet(false),5000);
});
</script>
</body>
</html>
